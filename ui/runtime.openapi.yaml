openapi: 3.1.0
info:
  title: The runtime interface of the generated UI
  version: 1.0.0
  description: >-
    What a runtime's adapter answers so that the panels generated by `agenticspec ui generate`
    show the live data of one admitted architecture, and what `agenticspec ui conform` checks.
    The adapter is the one block conformance drives: no second server, no view that exists only
    for the UI. Every request is made at a scope, `{root}/scopes/{scope}`, where `{scope}` is
    `{architecture_id}`, `{architecture_id}/{part path}` or `{architecture_id}/{part path}/{instance}`.
    A part path is one segment (`team.lead`, the path of a nested part joined by dots); an instance
    is the 1-based copy of a part that runs several. The scope changes no view parameter.


    R1 read: `GET /api/views/{view}` answers `{"rows": [...]}` with only the rows in scope. A row
    is in scope of a part (or of one copy of it) when its key, or a top-level field of the row that
    holds the identifier of an entity, equals the `entity_id` of a placement
    (`agentic.architecture.Placements`) to that part (and copy); no second hop. At an
    architecture scope a row is in scope when such a field equals the `entity_id` of any placement
    in the architecture. R3 is R1 on the views of `x-agentic-runtime.r3_views`, answered for the
    architecture of the scope; `Placements` and `Parts` keep only the part (and copy) at a part
    scope.


    R2 feed: `GET /api/channels/{channel}` is a stream of server-sent events, each with `event:`
    the event's qualified name, `data:` the event as JSON and `id:` its cursor. A channel at a
    scope carries the events in scope by the rule of R1 applied to the event's fields. A reconnect
    with `Last-Event-ID: c` receives exactly the events that followed the event of cursor c, in
    order, and none at or before it.


    R4 command: `POST /api/commands/{command}` with the command's input as a JSON object answers
    `{"row": ...}` when the command was carried out, or status 422 with `{"row": ...}`, the
    refusal's row, when the model or the authority evaluator refused it.


    R5 action set: `GET /api/actions` answers, for the signed-in principal at the scope, every
    command the source accepts there with `allowed` and, when allowed, the grant it relied on. A
    command R5 does not list is not allowed. A grant covers a command at a scope when it is
    `Active`, its effect is `Allow` or `ApprovalRequired`, its grantee is the principal, its
    `action_class` is the command's action class, and its `scope` is the scope or a scope above it
    (`{architecture_id}` covers `{architecture_id}/team.lead`); a grant with effect `Deny` that
    would cover it by the same terms withholds it. A source without R5 answers 404;
    the UI then shows every action and the refusals come from R4. Hiding is a convenience: R4
    refuses a command R5 does not allow.


    Every request carries credentials, `Authorization: Bearer <token>` or the session cookie of
    the host's sign-in. A request without valid credentials is refused with 401 before anything is
    dispatched, and its body holds no `rows` and no `row`. The generated client sends cookies
    (`credentials: include`, `withCredentials`), so a source on another origin than the page
    answers CORS with credentials for that origin.
servers:
  - url: '{root}/scopes/{scope}'
    description: The adapter of the runtime that admitted the architecture, at one scope.
    variables:
      root:
        default: http://127.0.0.1:7430
        description: The adapter's address for the admitted architecture, without a trailing slash.
      scope:
        default: 00000000-0000-4000-8000-463ec9280000/team.lead
        description: '`{architecture_id}`, `{architecture_id}/{part path}` or `{architecture_id}/{part path}/{instance}`.'
x-agentic-runtime:
  scope_prefix: /scopes/
  r3_views:
    - agentic.architecture.Placements
    - agentic.architecture.Parts
    - agentic.architecture.Reach
    - agentic.architecture.Revisions
    - agentic.architecture.Contracts
  cursor_header: Last-Event-ID
  session_cookie: agentic_session
security:
  - bearer: []
  - session: []
paths:
  /api/views/{view}:
    get:
      operationId: read
      summary: R1 and R3, the rows of a view in scope
      parameters:
        - $ref: '#/components/parameters/view'
        - $ref: '#/components/parameters/params'
      responses:
        '200':
          description: The rows of the view in scope, by the scope rule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rows'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/channels/{channel}:
    get:
      operationId: subscribe
      summary: R2, the events of a channel in scope, resumable from a cursor
      parameters:
        - $ref: '#/components/parameters/channel'
        - $ref: '#/components/parameters/params'
        - name: Last-Event-ID
          in: header
          required: false
          description: The cursor of the last event the client received; the stream resumes after it.
          schema: {type: string}
      responses:
        '200':
          description: >-
            A stream of server-sent events. Each event has `event:` its qualified name, `data:` the
            event as JSON on one line and `id:` its cursor. A line starting with `:` is a comment.
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/commands/{command}:
    post:
      operationId: command
      summary: R4, a command at the scope
      parameters:
        - $ref: '#/components/parameters/command'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The command's input by its field names.
      responses:
        '200':
          description: The command was carried out.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Answer'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: The model or the authority evaluator refused the command; nothing changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refused'}
  /api/actions:
    get:
      operationId: actions
      summary: R5, the commands the signed-in principal may issue at the scope
      responses:
        '200':
          description: Every command the source accepts at the scope, allowed or not.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Action'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404':
          description: The source has no R5; every action is shown and R4 refuses.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: The credential `agenticspec ui conform` sends; every conforming source accepts it.
    session:
      type: apiKey
      in: cookie
      name: agentic_session
      description: The session cookie of the host's sign-in, which a browser sends with every request and stream.
  parameters:
    view:
      name: view
      in: path
      required: true
      description: The qualified name of a view, such as `agentic.harness.Turns`.
      schema: {type: string}
    channel:
      name: channel
      in: path
      required: true
      description: The name of a channel of the document, such as `harness`.
      schema: {type: string}
    command:
      name: command
      in: path
      required: true
      description: The qualified name of a command, such as `agentic.question.Answer`.
      schema: {type: string}
    params:
      name: params
      in: query
      required: false
      description: The parameters the view or channel declares, by name; the scope is not one of them.
      style: form
      explode: true
      schema:
        type: object
        additionalProperties: {type: string}
  responses:
    Unauthenticated:
      description: No valid credentials; nothing was dispatched.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: No such scope, view, channel or command at this source.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Rows:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            type: object
            description: A row of the view by its field names; its first field is the view's key.
    Answer:
      type: object
      required: [row]
      properties:
        row:
          type: [object, 'null']
          description: The row the command answers with, or null.
    Refused:
      type: object
      required: [row]
      properties:
        row:
          type: object
          required: [error]
          properties:
            error:
              type: string
              description: The qualified name of the error, such as `agentic.authority.NoGrantCovers`.
            outcome:
              type: string
              description: The name of the outcome that refused.
          additionalProperties: true
          description: The refusal's row, the error's fields beside its name.
    Action:
      type: object
      required: [command, allowed]
      properties:
        command:
          type: string
          description: The qualified name of the command.
        allowed:
          type: boolean
        grant_id:
          type: string
          description: The grant the evaluator relied on; present when `allowed` is true.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: The name of the error, such as `Unauthenticated` or `NoSuchView`.
        message:
          type: string
      not:
        anyOf:
          - required: [rows]
          - required: [row]
