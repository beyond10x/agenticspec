widgets:
  agentic.delegation.ActiveDelegations:
    summary: "Rows of the view agentic.delegation.ActiveDelegations over Delegation, keyed by delegation_id."
    params:
      source: {type: {optional: string}, note: "the base URL of the runtime adapter that answers this scope; absent, the renderer's own"}
      architecture: {type: {optional: ArchitectureId}, note: "the architecture the rows are scoped to; the runtime narrows the rows, not this document"}
      part: {type: {optional: string}, note: "the path of the part within the architecture, such as team.lead"}
      instance: {type: {optional: integer}, note: the copy of a part that runs more than one}
      channel: {type: {ref: channel}, required: true, note: "the channel of the page; it carries the events the panel takes"}
    body:
      - name: rows
        component: collection
        style: table
        reads: {view: agentic.delegation.ActiveDelegations, key: delegation_id}
        live:
          channel: args.channel
          on:
            - agentic.delegation.DelegatedActionTaken
            - agentic.delegation.DelegationExpiredRecorded
            - agentic.delegation.DelegationGranted
            - agentic.delegation.DelegationPassedOn
            - agentic.delegation.DelegationRevoked
          effect: refetch
          coalesce: 1s
        columns:
          - delegation_id
          - delegate
          - root
          - {field: action, as: badge}
