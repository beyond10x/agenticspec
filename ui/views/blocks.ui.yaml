# Generated by `agenticspec ui panels` from blocks/. Never edited by hand: run `task ui:panels`.
format: ess-ui/1
app: blocks
title: Building blocks
model: agentic
actor: from_session
placement_profile: fat
fixtures: {dir: fixtures, index: fixtures/index.yaml}

shells:
  app:
    regions:
      nav: {kind: navigation}
      main: {kind: page_outlet}

navigation:
  home: delegation
  sections:
    - {name: layer_1, label: "Layer 1: principals", pages: [delegation, principal]}
    - {name: layer_2, label: "Layer 2: intelligence", pages: [gateway, model]}
    - {name: layer_3, label: "Layer 3: capability", pages: [knowledge, store, tool]}
    - {name: layer_4, label: "Layer 4: agent", pages: [agent, harness]}
    - {name: layer_5, label: "Layer 5: work", pages: [process, work]}
    - {name: layer_6, label: "Layer 6: governance", pages: [authority]}
    - {name: layer_7, label: "Layer 7: collaboration", pages: [channel, question, trigger]}
    - {name: layer_8, label: "Layer 8: place", pages: [resource, runtime, sandbox, workspace]}
    - {name: layer_9, label: "Layer 9: composition", pages: [architecture, deployment]}
    - {name: layer_10, label: "Layer 10: evaluation", pages: [experiment, kpi]}

page_kinds:
  gallery:
    purpose: every panel of one block, over the fixtures

