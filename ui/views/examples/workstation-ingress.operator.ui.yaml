pages:
  overview:
    kind: overview
    title: workstation-ingress
    nav: {label: Overview}
    state:
      reach_part: {type: string, class: page_state, store: memory}
    sections:
      - name: parts
        title: Parts
        component: collection
        style: table
        reads: {view: agentic.architecture.Parts, key: part_id, paging: none}
        columns:
          - {field: name, label: Part}
          - {field: kind, as: badge, label: Kind}
          - {field: count, as: number, label: Copies}
          - {field: on_border, label: On the border}
      - name: reach
        title: Reach
        component: collection
        style: table
        reads: {view: agentic.architecture.Reach, key: link_id, params: {architecture_id: "'workstation-ingress'"}, paging: none, filter: "row.from_name contains state.reach_part or row.to_name contains state.reach_part"}
        columns:
          - {field: from_name, label: From}
          - {field: to_name, label: To}
          - {field: carries, as: badge, label: Carries}
          - {field: from_kind, as: badge, label: From kind}
          - {field: to_kind, as: badge, label: To kind}
        states:
          empty: {message: No link matches.}
      - name: graph
        title: Graph
        host: DraftGraph
        reason: draws the parts and links of this level on a canvas at natural size with pan, zoom and fit, each nested architecture as one box; no ess-ui composite lays out and draws an architecture graph
        stands_in_for: none
        reads: {placeholder: agentic.architecture.Graph, fixture: graph.json, params: {architecture: "'workstation-ingress'"}}
      - name: settings
        title: Policies and marked places
        host: ArchitectureSettings
        reason: shows the policies and the marked places of the document read-only; no view of the blocks holds them
        stands_in_for: none
        reads: {placeholder: agentic.architecture.Settings, fixture: settings.json, params: {architecture: "'workstation-ingress'"}}
  part.admin:
    kind: part
    title: admin
    nav: {label: admin}
    layout:
      areas:
        grid: [[area_instances]]
        place:
          area_instances: [principal_principals]
    sections:
      - name: principal_principals
        title: Principals
        component: agentic.principal.Principals
        args: {architecture: "'workstation-ingress'", part: "'admin'", channel: level}
  part.box:
    kind: part
    title: box
    nav: {label: box}
    layout:
      areas:
        grid: [[area_instances]]
        place:
          area_instances: [sandbox_sandboxes]
    sections:
      - name: sandbox_sandboxes
        title: Sandboxes
        component: agentic.sandbox.Sandboxes
        args: {architecture: "'workstation-ingress'", part: "'box'", channel: level}
  part.builds:
    kind: part
    title: builds
    nav: {label: builds}
    layout:
      areas:
        grid: [[area_instances], [area_resource]]
        place:
          area_instances: [resource_pools]
          area_resource: {sections: [resource_claims, resource_queue], frame: shared, title: Resource, collapsed: true}
    sections:
      - name: resource_pools
        title: Pools
        component: agentic.resource.Pools
        args: {architecture: "'workstation-ingress'", part: "'builds'", channel: level}
      - name: resource_claims
        title: Claims
        component: agentic.resource.Claims
        args: {architecture: "'workstation-ingress'", part: "'builds'", channel: level}
      - name: resource_queue
        title: Queue of a pool
        component: agentic.resource.Queue
        args: {architecture: "'workstation-ingress'", part: "'builds'", channel: level, pool_id: "'00000000-0000-4000-8000-e7e96cf90000'"}
  part.chat:
    kind: part
    title: chat
    nav: {label: chat}
    layout:
      areas:
        grid: [[area_instances], [area_channel]]
        place:
          area_instances: [channel_channels]
          area_channel: {sections: [channel_channel_messages, channel_channel_posts, channel_messages, channel_posts, channel_subscriptions], frame: shared, title: Channel, collapsed: true}
    sections:
      - name: channel_channels
        title: Channels
        component: agentic.channel.Channels
        args: {architecture: "'workstation-ingress'", part: "'chat'", channel: level}
      - name: channel_channel_messages
        title: Messages of a channel
        component: agentic.channel.ChannelMessages
        args: {architecture: "'workstation-ingress'", part: "'chat'", channel: level, channel_id: "'00000000-0000-4000-8000-f4f3536e0000'"}
      - name: channel_channel_posts
        title: Posts of a channel
        component: agentic.channel.ChannelPosts
        args: {architecture: "'workstation-ingress'", part: "'chat'", channel: level, channel_id: "'00000000-0000-4000-8000-f4f3536e0000'"}
      - name: channel_messages
        title: Messages
        component: agentic.channel.Messages
        args: {architecture: "'workstation-ingress'", part: "'chat'", channel: level}
      - name: channel_posts
        title: Posts
        component: agentic.channel.Posts
        args: {architecture: "'workstation-ingress'", part: "'chat'", channel: level}
      - name: channel_subscriptions
        title: Subscriptions
        component: agentic.channel.Subscriptions
        args: {architecture: "'workstation-ingress'", part: "'chat'", channel: level}
  part.gateway:
    kind: part
    title: gateway
    nav: {label: gateway}
    layout:
      areas:
        grid: [[area_instances], [area_gateway]]
        place:
          area_instances: [gateway_gateways]
          area_gateway: {sections: [gateway_calls, gateway_upstreams], frame: shared, title: Gateway}
    sections:
      - name: gateway_gateways
        title: Gateways
        component: collection
        style: table
        reads: {view: agentic.gateway.Gateways, key: gateway_id}
        live:
          channel: level
          on:
            - agentic.gateway.GatewayDrained
            - agentic.gateway.GatewayOpened
            - agentic.gateway.GatewayStopped
          effect: refetch
          coalesce: 1s
        columns:
          - gateway_id
          - name
          - {field: state, as: badge}
        row_actions:
          - {name: drain_gateway, does: agentic.gateway.DrainGateway, bind: {gateway_id: row.gateway_id}, label: Drain a gateway, visible: "actor.may(agentic.gateway.DrainGateway)"}
          - {name: stop_gateway, does: agentic.gateway.StopGateway, bind: {gateway_id: row.gateway_id}, label: Stop a gateway, visible: "actor.may(agentic.gateway.StopGateway)"}
      - name: gateway_calls
        title: Calls
        component: agentic.gateway.Calls
        args: {architecture: "'workstation-ingress'", part: "'gateway'", channel: level}
      - name: gateway_upstreams
        title: Upstreams
        component: collection
        style: table
        reads: {view: agentic.gateway.Upstreams, key: upstream_id}
        live:
          channel: level
          on:
            - agentic.gateway.UpstreamAttached
            - agentic.gateway.UpstreamDetached
            - agentic.gateway.UpstreamRestored
            - agentic.gateway.UpstreamSaturated
          effect: refetch
          coalesce: 1s
        columns:
          - upstream_id
          - gateway_id
          - endpoint_id
          - {field: state, as: badge}
        row_actions:
          - {name: detach_upstream, does: agentic.gateway.DetachUpstream, bind: {upstream_id: row.upstream_id}, label: Detach an upstream, visible: "actor.may(agentic.gateway.DetachUpstream)"}
  part.model:
    kind: part
    title: model
    nav: {label: model}
    layout:
      areas:
        grid: [[area_instances], [area_model]]
        place:
          area_instances: [model_models]
          area_model: {sections: [model_endpoints, model_inferences, model_routes], frame: shared, title: Model, collapsed: true}
    sections:
      - name: model_models
        title: Models
        component: agentic.model.Models
        args: {architecture: "'workstation-ingress'", part: "'model'", channel: level}
      - name: model_endpoints
        title: Endpoints
        component: agentic.model.Endpoints
