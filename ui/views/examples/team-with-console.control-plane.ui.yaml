navigation:
  home: overview
  sections:
    - {name: architecture, label: team-with-console, pages: [overview]}
    - {name: control, label: Control plane, pages: [control.inbox, control.activity, control.operations, control.metrics, control.architecture, control.events]}
    - {name: nested_console, label: console, pages: [console.overview, part.console.helper, part.console.steward, part.console.gateway, part.console.model]}
    - {name: kind_agent, label: Agent, pages: [part.worker]}
    - {name: kind_gateway, label: Gateway, pages: [part.gateway]}
    - {name: kind_model, label: Model, pages: [part.model]}
    - {name: kind_principal, label: Principal, pages: [part.owner]}

page_kinds:
  overview:
    purpose: one level of the architecture - its parts, its links and its graph
  part:
    purpose: the panels of one part - its instances first, then each domain it uses
  across:
    purpose: one concern of the control plane across every part - what waits for an answer, what ran, what was set up, what is measured, the architecture and its events

