        args: {architecture: "'team-with-console'", part: "'model'", channel: level}
      - name: model_routes
        title: Routes
        component: agentic.model.Routes
        args: {architecture: "'team-with-console'", part: "'model'", channel: level}
  part.owner:
    kind: part
    title: owner
    nav: {label: owner}
    layout:
      areas:
        grid: [[area_instances], [area_question]]
        place:
          area_instances: [principal_principals]
          area_question: {sections: [question_open_questions, question_questions], frame: shared, title: Question}
    sections:
      - name: principal_principals
        title: Principals
        component: agentic.principal.Principals
        args: {architecture: "'team-with-console'", part: "'owner'", channel: level}
      - name: question_open_questions
        title: Open questions of an addressee
        component: collection
        style: table
        reads: {view: agentic.question.OpenQuestions, key: question_id, params: {addressee: "'00000000-0000-4000-8000-761908b00000'"}}
        live:
          channel: level
          on:
            - agentic.question.AnswerNotRead
            - agentic.question.DefaultTaken
            - agentic.question.QuestionAnswered
            - agentic.question.QuestionAsked
