pages:
  overview:
    kind: overview
    title: team-with-console
    nav: {label: Overview}
    state:
      reach_part: {type: string, class: page_state, store: memory}
    sections:
      - name: tiles
        title: At a glance
        host: ControlTiles
        reason: counts the open rows of each Inbox view, the rows per state of each Operations view and shows each KPI as one tile; no ess-ui composite aggregates the rows of several reads
        stands_in_for: none
        reads: {placeholder: agentic.architecture.ControlTiles, fixture: tiles.json, params: {architecture: "'team-with-console'"}}
      - name: parts
        title: Parts
        component: collection
        style: table
        reads: {view: agentic.architecture.Parts, key: part_id, paging: none}
        columns:
          - {field: name, label: Part}
          - {field: kind, as: badge, label: Kind}
          - {field: count, as: number, label: Copies}
          - {field: on_border, label: On the border}
      - name: reach
        title: Reach
        component: collection
        style: table
        reads: {view: agentic.architecture.Reach, key: link_id, params: {architecture_id: "'team-with-console'"}, paging: none, filter: "row.from_name contains state.reach_part or row.to_name contains state.reach_part"}
        columns:
          - {field: from_name, label: From}
          - {field: to_name, label: To}
          - {field: carries, as: badge, label: Carries}
          - {field: from_kind, as: badge, label: From kind}
          - {field: to_kind, as: badge, label: To kind}
        states:
          empty: {message: No link matches.}
      - name: graph
        title: Graph
        host: DraftGraph
        reason: draws the parts and links of this level on a canvas at natural size with pan, zoom and fit, each nested architecture as one box; no ess-ui composite lays out and draws an architecture graph
        stands_in_for: none
        reads: {placeholder: agentic.architecture.Graph, fixture: graph.json, params: {architecture: "'team-with-console'"}}
      - name: settings
        title: Policies and marked places
        host: ArchitectureSettings
        reason: shows the policies and the marked places of the document read-only; no view of the blocks holds them
        stands_in_for: none
        reads: {placeholder: agentic.architecture.Settings, fixture: settings.json, params: {architecture: "'team-with-console'"}}
  part.gateway:
    kind: part
    title: gateway
    nav: {label: gateway}
    layout:
      areas:
        grid: [[area_instances], [area_gateway]]
        place:
          area_instances: [gateway_gateways]
          area_gateway: {sections: [gateway_calls, gateway_upstreams], frame: shared, title: Gateway, collapsed: true}
    sections:
      - name: gateway_gateways
        title: Gateways
        component: agentic.gateway.Gateways
        args: {architecture: "'team-with-console'", part: "'gateway'", channel: level}
      - name: gateway_calls
        title: Calls
        component: agentic.gateway.Calls
        args: {architecture: "'team-with-console'", part: "'gateway'", channel: level}
      - name: gateway_upstreams
        title: Upstreams
        component: agentic.gateway.Upstreams
        args: {architecture: "'team-with-console'", part: "'gateway'", channel: level}
  part.model:
    kind: part
    title: model
    nav: {label: model}
    layout:
      areas:
        grid: [[area_instances], [area_model]]
        place:
          area_instances: [model_models]
          area_model: {sections: [model_endpoints, model_inferences, model_routes], frame: shared, title: Model, collapsed: true}
    sections:
      - name: model_models
        title: Models
        component: agentic.model.Models
        args: {architecture: "'team-with-console'", part: "'model'", channel: level}
      - name: model_endpoints
        title: Endpoints
        component: agentic.model.Endpoints
        args: {architecture: "'team-with-console'", part: "'model'", channel: level}
      - name: model_inferences
