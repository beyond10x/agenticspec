pages:
  overview:
    kind: overview
    title: large-37
    nav: {label: Overview}
    state:
      reach_part: {type: string, class: page_state, store: memory}
    sections:
      - name: parts
        title: Parts
        component: collection
        style: table
        reads: {view: agentic.architecture.Parts, key: part_id, paging: none}
        columns:
          - {field: name, label: Part}
          - {field: kind, as: badge, label: Kind}
          - {field: count, as: number, label: Copies}
          - {field: on_border, label: On the border}
      - name: reach
        title: Reach
        component: collection
        style: table
        reads: {view: agentic.architecture.Reach, key: link_id, params: {architecture_id: "'large-37'"}, paging: none, filter: "row.from_name contains state.reach_part or row.to_name contains state.reach_part"}
        columns:
          - {field: from_name, label: From}
          - {field: to_name, label: To}
          - {field: carries, as: badge, label: Carries}
          - {field: from_kind, as: badge, label: From kind}
          - {field: to_kind, as: badge, label: To kind}
        states:
          empty: {message: No link matches.}
      - name: graph
        title: Graph
        host: DraftGraph
        reason: draws the parts and links of this level on a canvas at natural size with pan, zoom and fit, each nested architecture as one box; no ess-ui composite lays out and draws an architecture graph
        stands_in_for: none
        reads: {placeholder: agentic.architecture.Graph, fixture: graph.json, params: {architecture: "'large-37'"}}
      - name: settings
        title: Policies and marked places
        host: ArchitectureSettings
        reason: shows the policies and the marked places of the document read-only; no view of the blocks holds them
        stands_in_for: none
        reads: {placeholder: agentic.architecture.Settings, fixture: settings.json, params: {architecture: "'large-37'"}}
