# The one component of the studio: `agenticstudio serve`, which holds the drafts and answers the
# studio's page (studio/studio.ui.yaml) over HTTP on 127.0.0.1. It opens drafts, starts the
# sessions the page and the agent channel (`agenticstudio-mcp`) work in, carries out each tool
# call of a session (query, apply, check, simulate) and answers or fails it, and publishes each
# new revision and each answered call on the event channel of the draft.
components:
  - component: studio-server
    summary: >-
      Holds the drafts, their revisions and the sessions on them in memory and serves the
      studio's page, its reads, its commands and the event channel of each draft over HTTP on
      127.0.0.1 (`agenticstudio serve`).
    owns:
      domains:
        - studio.draft
        - studio.session
        # UNMAPPED: no component serves studio.evaluation. `agenticstudio serve` answers a
        # simulate in the tool call's answer and records no evaluation: it holds no Evaluation
        # row, serves no Evaluations view and takes none of StartEvaluation, CompleteEvaluation
        # and FailEvaluation. The studio server owns the domain and accepts its commands once it
        # records evaluations (story studio-evaluation). Open question for the owner: keep the
        # domain declared ahead of that code, or remove it until then.
    accepts:
      commands:
        - studio.draft.OpenDraft
        - studio.draft.ReviseDraft
        - studio.session.StartSession
        - studio.session.CloseSession
        - studio.session.CallTool
        - studio.session.AnswerToolCall
        - studio.session.FailToolCall
    publishes:
      events:
        - studio.draft.DraftOpened
        - studio.draft.DraftRevised
        - studio.session.SessionStarted
        - studio.session.SessionClosed
        - studio.session.ToolCalled
        - studio.session.ToolCallAnswered
        - studio.session.ToolCallFailed
    reached_by: network
