# The one component of the studio: `agenticstudio serve`, which holds the drafts and answers the
# studio's page (studio/studio.ui.yaml) over HTTP on 127.0.0.1. It opens drafts and carries out
# the user's tool calls on them (in the first slice an apply, by patch).
components:
  - component: studio-server
    summary: >-
      Holds the drafts and their revisions in memory and serves the studio's page, its reads and
      its commands over HTTP on 127.0.0.1 (`agenticstudio serve`).
    owns:
      domains:
        - studio.draft
        - studio.session
        - studio.evaluation
    accepts:
      commands:
        - studio.draft.OpenDraft
        - studio.session.CallTool
    publishes:
      events:
        - studio.draft.DraftOpened
        - studio.session.ToolCalled
    reached_by: network
