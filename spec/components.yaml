components:
  - component: session-ir
    summary: Replays the commands an adapter lifted from a transcript and holds the resulting session state.
    owns:
      domains:
        - agentspec.session
    accepts:
      commands:
        - agentspec.session.OpenSession
        - agentspec.session.EndSession
        - agentspec.session.StartAgent
        - agentspec.session.EndAgent
        - agentspec.session.SubmitPrompt
        - agentspec.session.EndTurn
        - agentspec.session.RecordModelTurn
        - agentspec.session.CompactContext
        - agentspec.session.RequestToolCall
        - agentspec.session.DecideToolCall
        - agentspec.session.CompleteToolCall
        - agentspec.session.RecordExposure
    publishes:
      events:
        - agentspec.session.SessionOpened
        - agentspec.session.SessionEnded
        - agentspec.session.AgentStarted
        - agentspec.session.AgentEnded
        - agentspec.session.PromptSubmitted
        - agentspec.session.TurnEnded
        - agentspec.session.ModelTurnRecorded
        - agentspec.session.ContextCompacted
        - agentspec.session.ToolCallRequested
        - agentspec.session.ToolCallDecided
        - agentspec.session.ToolCallCompleted
        - agentspec.session.ExposureDetected
    reached_by: network

  # No command writes the rows of `agentspec.view` and no outcome emits its three events: they
  # are a projection of what `session-ir` publishes, which `agentspec sync` writes to the local
  # store and `agentspec serve` reads and streams (decided 2026-11-26). A gateway that pushes a
  # running session sends the same three events.
  - component: session-view
    summary: >-
      Serves the read models of the UI (`ui/agentspec.ui.yaml`) over HTTP: the session list, one
      session, its agents and its events, and publishes their changes for a live page.
    owns:
      domains:
        - agentspec.view
    publishes:
      events:
        - agentspec.view.SessionUpdated
        - agentspec.view.AgentUpdated
        - agentspec.view.EventAppended
    reached_by: network
