name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version
    if: github.event_name == 'push' || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: The version of the tag, or of the release branch
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then
            version=$TAG
          else
            version=$(awk '/^\[/ { table = $0; next } table == "[workspace.package]" && /^version[ \t]*=/ { sub(/^version[ \t]*=[ \t]*"/, ""); sub(/".*$/, ""); print; exit }' Cargo.toml)
            if [ "$HEAD_REF" != "release/$version" ]; then
              echo "::error::the branch $HEAD_REF is not release/$version, the workspace version" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The version, the workspace version and the changelog agree
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sh scripts/release-check.sh "$VERSION"

  gate:
    name: Gate
    needs: version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read the rustc pinned in rust-toolchain.toml
        id: rustc
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: ${{ steps.rustc.outputs.channel }}
          components: rustfmt, clippy
      - name: Show the rustc the gate builds with
        env:
          CHANNEL: ${{ steps.rustc.outputs.channel }}
        run: |
          set -euo pipefail
          rustc --version
          rustc --version | grep -F "rustc $CHANNEL "
      - name: Install task
        env:
          GO_TASK_VERSION: "3.54.0"
          GO_TASK_SHA256: 680859dbb4d881a9c72d4d9a8f510825450849af8567deacd7302c01124416fb
        run: |
          set -euo pipefail
          asset=task_linux_amd64.tar.gz
          mkdir -p "$RUNNER_TEMP/task"
          cd "$RUNNER_TEMP/task"
          curl --fail --silent --show-error --location --output "$asset" \
            "https://github.com/go-task/task/releases/download/v$GO_TASK_VERSION/$asset"
          echo "$GO_TASK_SHA256  $asset" | sha256sum --check --strict
          tar -xzf "$asset" task
          echo "$RUNNER_TEMP/task" >> "$GITHUB_PATH"
          ./task --version | grep -Fx "$GO_TASK_VERSION"
      - name: Install cargo-nextest
        env:
          NEXTEST_VERSION: "0.9.143"
          NEXTEST_SHA256: 66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e
        run: |
          set -euo pipefail
          asset="cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$RUNNER_TEMP/nextest"
          cd "$RUNNER_TEMP/nextest"
          curl --fail --silent --show-error --location --output "$asset" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/$asset"
          echo "$NEXTEST_SHA256  $asset" | sha256sum --check --strict
          tar -xzf "$asset" cargo-nextest
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
          ./cargo-nextest --version | grep -F "cargo-nextest $NEXTEST_VERSION "
      - name: Install ess
        env:
          ESS_VERSION: "0.99.2"
          ESS_SHA256: 8b32cb02ac156929a873f4a1faf4c8c6d686d45565ce567ce2d360b9072dc42e
        run: |
          set -euo pipefail
          name="ess-$ESS_VERSION-x86_64-unknown-linux-gnu"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$name.tar.gz" \
            "https://github.com/beyond10x/ess/releases/download/$ESS_VERSION/$name.tar.gz"
          echo "$ESS_SHA256  $name.tar.gz" | sha256sum --check --strict
          tar -xzf "$name.tar.gz"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
          "./$name/ess" --version | grep -Fx "ess $ESS_VERSION"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: Install the browser and its system libraries for the app gate
        working-directory: ui/app
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --loglevel=error
          npx playwright install --with-deps --only-shell chromium
      - name: Run the repository gate
        run: task check

  package:
    name: Package ${{ matrix.target }}
    needs: [version, gate]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && github.event_name == 'pull_request')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # Static: no glibc of the host, the archive consumers pin.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out with LF line ends on Windows, as on every other runner
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Read the rustc pinned in rust-toolchain.toml
        id: rustc
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: ${{ steps.rustc.outputs.channel }}
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      # libsqlite3-sys (bundled) and zstd-sys compile C; the image has no compiler for musl,
      # musl-tools brings `musl-gcc`, which makes static objects.
      - name: Install a C compiler that targets musl
        if: contains(matrix.target, '-linux-musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Install Rosetta 2 to run the x86_64 binary
        if: matrix.target == 'x86_64-apple-darwin'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      # The runner's home, cargo home and checkout are compiled into panic locations and C
      # assertions; they are mapped to neutral prefixes so no runner path ships. RUSTFLAGS
      # replaces target.<triple>.rustflags of .cargo/config.toml, so crt-static is repeated here.
      - name: Build agenticspec and write its archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          home=$HOME
          cargo_home=${CARGO_HOME:-$HOME/.cargo}
          workspace=$GITHUB_WORKSPACE
          if [ "$RUNNER_OS" = Windows ]; then
            home=$(cygpath -w "$home")
            cargo_home=$(cygpath -w "$cargo_home")
            workspace=$(cygpath -w "$workspace")
          fi
          flags="--remap-path-prefix=$home=/home --remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=$workspace=/build"
          case "$TARGET" in *-windows-*) flags="$flags -C target-feature=+crt-static" ;; esac
          export RUSTFLAGS="$flags"
          if [ "$RUNNER_OS" != Windows ]; then
            export CFLAGS="-ffile-prefix-map=$cargo_home=/cargo -ffile-prefix-map=$workspace=/build -ffile-prefix-map=$home=/home"
          fi
          cargo build --locked --release --bin agenticspec --target "$TARGET"
          case "$TARGET" in *-windows-*) exe=.exe ;; *) exe= ;; esac
          sh scripts/release-package.sh archive "$VERSION" "$TARGET" "target/$TARGET/release/agenticspec$exe" dist
      - name: The binary names no runner home or checkout path
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in *-windows-*) exe=.exe ;; *) exe= ;; esac
          sh scripts/release-paths.sh "target/$TARGET/release/agenticspec$exe"
      - name: The musl binary is static and runs in a plain Alpine container
        if: contains(matrix.target, '-linux-musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/agenticspec"
          file "$binary"
          file "$binary" | grep -Eq 'statically linked|static-pie linked'
          if ldd "$binary" 2>&1 | grep -q '=>'; then echo "::error::$binary loads shared libraries" >&2; exit 1; fi
          printed=$(docker run --rm -v "$PWD/target/$TARGET/release:/b:ro" alpine@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f /b/agenticspec --version)
          echo "alpine: $printed"
          test "$printed" = "agenticspec $VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.target }}
          path: dist/agenticspec-*
          if-no-files-found: error

  bundle:
    name: Bundle the release assets
    needs: [version, package]
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Write the checksums and the notes
        run: |
          set -euo pipefail
          sh scripts/release-package.sh sums "$VERSION" dist
          sh scripts/release-package.sh notes "$VERSION" CHANGELOG.md > dist/notes.md
          cat dist/notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agenticspec-${{ needs.version.outputs.version }}-release
          path: dist/*
          if-no-files-found: error
