format: agenticspec-binding/1
binding: secret-value
architecture: workstation
summary: >-
  Secrets given where names belong: text that is no name, a secret with its value, a value on a
  part and a value on an egress entry. Each value here is a made-up placeholder.
parts:
  operator:
    egress: [owner]
    secrets: [{name: chat-token, value: placeholder}]
  gateway:
    egress: [{to: model, secret: model-api-key, data: placeholder}]
    secrets: [model-api-key, "Model Key Text"]
    value: placeholder
