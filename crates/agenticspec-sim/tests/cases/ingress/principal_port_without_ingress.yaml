format: agenticspec-architecture/1
architecture: ingress-small
summary: "Refused: the default operator ingress is opted out, and no ingress of the owner carries the answer to the operator's questions."

parts:
  owner:    { block: principal, kind: human }
  admin:    { block: principal, kind: human }
  operator: { block: agent, harness: coding, acts_for: owner }
  gateway:  { block: gateway }
  model:    { block: model }
  chat:     { block: channel }

links:
  - { from: owner,    to: operator, carries: prompt, over: chat }
  - { from: operator, to: owner,    carries: question, over: chat }
  - { from: operator, to: gateway,  carries: model_call }
  - { from: gateway,  to: model,    carries: model_call }

border: [operator]

ingress:
  operator: none
  user:
    audience: owner
    interface: { views: true }
    exports: [{ protocol: http }]
  ops:
    audience: admin
    authenticated: false
    interface: { scope: all, metrics: [cost_usd] }
    exports: [{ protocol: metrics_scrape }]
