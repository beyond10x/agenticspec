[package]
name = "agenticstudio"
description = "agenticstudio: open a draft of an agenticspec architecture in the browser, apply patches, see the graph and the check"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agenticstudio"
path = "src/main.rs"

[dependencies]
agenticspec-patch.workspace = true
agenticspec-records.workspace = true
agenticspec-render.workspace = true
agenticspec-sim.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
