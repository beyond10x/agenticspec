format: agenticspec-architecture/1
architecture: large-37
summary: >-
  A test fixture, not an architecture to copy: 37 parts and 90 links, wider than any page, so the
  renderer's large-graph view (natural size, pan, zoom, fit, the parts and links tables) has
  something to hold.

parts:
  owner:       { block: principal, kind: human }
  maintainer:  { block: principal, kind: human }
  operator:    { block: agent, harness: coding, role: operator, acts_for: owner }
  planner:     { block: agent, harness: coding, role: planner }
  architect:   { block: agent, harness: coding, role: architect }
  builders:    { block: agent, harness: coding, role: executor, count: 6 }
  testers:     { block: agent, harness: coding, role: tester, count: 3 }
  reviewers:   { block: agent, harness: coding, role: reviewer, count: 2 }
  writer:      { block: agent, harness: coding, role: writer }
  release:     { block: agent, harness: coding, role: release }
  triage:      { block: agent, harness: coding, role: triage, count: 2 }
  night:       { block: agent, harness: coding, count: 3 }
  harness:     { block: harness, kind: coding }
  board:       { block: channel, kind: agent_message, distribution: board }
  alerts:      { block: channel, kind: notification, distribution: topic }
  approvals:   { block: question, kind: approval }
  backlog:     { block: work, kind: backlog }
  specs:       { block: work, kind: spec }
  evidence:    { block: work, kind: evidence }
  grants:      { block: authority, kind: permissions }
  budgets:     { block: authority, kind: budget }
  gateway:     { block: gateway, rate_limit_per_minute: 240 }
  frontier:    { block: model, route: frontier }
  small:       { block: model, route: small }
  tests:       { block: tool, category: execute, kind: test_suite }
  lint:        { block: tool, category: execute, kind: linter }
  search:      { block: tool, category: read, kind: code_search }
  context:     { block: knowledge, kind: context_files }
  contract:    { block: knowledge, kind: contract }
  runbook:     { block: knowledge, kind: runbook }
  repo:        { block: workspace, kind: checkout, sharing: exclusive, per: operator }
  trees:       { block: workspace, kind: worktree, sharing: exclusive, per: builders }
  box:         { block: sandbox, isolation: container, per: night }
  ci:          { block: runtime, kind: ci }
  slots:       { block: pool, kind: build_slots, capacity: 16 }
  clock:       { block: schedule, every: 30m }
  kpis:        { block: kpi, kind: delivery }

links:
  - { from: owner,      to: operator,   carries: prompt }
  - { from: operator,   to: owner,      carries: question }
  - { from: operator,   to: owner,      carries: proposal }
