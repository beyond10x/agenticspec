[workspace]
resolver = "3"
members = ["crates/agenticspec", "crates/agenticspec-records", "crates/agenticspec-sim", "crates/agenticspec-render", "crates/agenticspec-docs", "crates/agenticspec-patch", "crates/agenticstudio", "crates/agenticstudio-mcp", "crates/agenticspec-ui"]
exclude = ["generated", "crates/agenticspec-cli-contract"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/agenticspec"
publish = false

[workspace.dependencies]
agenticspec-types = { path = "generated/crates/agenticspec-types" }
session-ir = { path = "generated/crates/session-ir" }
session-view = { path = "generated/crates/session-view" }
agenticspec-system = { path = "generated/crates/agenticspec-system" }
agenticspec-server = { path = "generated/crates/agenticspec-server" }
agenticspec-cli-contract = { path = "crates/agenticspec-cli-contract" }
agenticspec-records = { path = "crates/agenticspec-records" }
agenticspec-render = { path = "crates/agenticspec-render" }
agenticspec-sim = { path = "crates/agenticspec-sim" }
agenticspec-patch = { path = "crates/agenticspec-patch" }
agenticspec-ui = { path = "crates/agenticspec-ui" }
agenticstudio = { path = "crates/agenticstudio" }
serde_json = "1"
sha2 = "0.10"
regex = "1"
rayon = "1"
serde_yaml_ng = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
zstd = "0.13"
