[workspace]
resolver = "3"
members = ["crates/agentspec", "crates/agentspec-records"]
exclude = ["generated", "crates/agentspec-cli-contract"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/agentspec"
publish = false

[workspace.dependencies]
agentspec-types = { path = "generated/crates/agentspec-types" }
session-ir = { path = "generated/crates/session-ir" }
session-view = { path = "generated/crates/session-view" }
agentspec-system = { path = "generated/crates/agentspec-system" }
agentspec-server = { path = "generated/crates/agentspec-server" }
agentspec-cli-contract = { path = "crates/agentspec-cli-contract" }
agentspec-records = { path = "crates/agentspec-records" }
serde_json = "1"
sha2 = "0.10"
regex = "1"
rayon = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
zstd = "0.13"
