architecture:
  document:
    architecture: workstation
    border:
    - operator
    format: agenticspec-architecture/1
    links:
    - carries: prompt
      from: owner
      over: chat
      to: operator
    - carries: question
      from: operator
      over: chat
      to: owner
    - carries: question
      from: worker
      to: operator
    - carries: order
      from: operator
      to: worker
    - carries: model_call
      from: operator
      to: gateway
    - carries: model_call
      from: worker
      to: gateway
    - carries: model_call
      from: gateway
      to: model
    - carries: claim
      from: worker
      to: builds
    parts:
      box:
        block: sandbox
        egress:
        - gateway
        isolation: process
        per: worker
      builds:
        block: pool
        capacity:
          value: 16
          vary:
          - 8
          - 16
          - 24
          - 32
        job_limit: 10m
        kind: build_slots
      chat:
        block: channel
        kind: operator
      gateway:
        block: gateway
        rate_limit_per_minute:
          value: 120
          vary:
          - 60
          - 120
          - 240
      model:
        block: model
        route: frontier
      operator:
        acts_for: owner
        block: agent
        harness: coding
        role: operator
      owner:
        block: principal
        kind: human
      tree:
        block: workspace
        per: worker
        sharing: exclusive
      worker:
        block: agent
        count:
          value: 12
          vary:
            max: 24
            min: 2
            step: 2
        harness: coding
    policies:
      operator_answers_alone:
        value: false
        vary:
        - false
        - true
      question_default_after:
        value: 15m
        vary:
        - 5m
        - 15m
        - 60m
    summary: One workstation, one owner, an operator agent acting for the owner, coding agents, a shared build pool.
    view:
      groups:
      - label: People
        name: people
        parts:
        - owner
      home: overview
      labels:
        parts:
          builds: build slots
          worker: coding agents
      order:
        parts:
        - owner
        - operator
        - worker
