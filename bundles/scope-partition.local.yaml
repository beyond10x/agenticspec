    summary: 'An upfront scope partition with a merge order: each copy of `team` owns one scope, every task goes to the owner of its scope, and merges land in the order the tasks finish. In 2610.07261 this integrated cleanly in 9 of 9 runs, against 4 of 9 when the agents reacted to each other and 1 of 9 without coordination; a vague change notice was no better than none. The simulator draws a task''s scope and lets it touch each other scope with the profile''s `scope_overlap`, so more scopes mean more tasks that cross one. A merge conflicts when another merge touched one of its scopes after its work started. Under `coordination: mesh` every copy tells the others which task it takes (one model call per reader) and a conflict costs a round of rework; under `none` the conflicting merge ships broken. The simulator does not model how the partition is cut or what cutting it costs, scopes whose load differs, conflicts inside one scope, nor a copy that helps another scope when its own is empty.'
