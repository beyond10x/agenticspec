    summary: 'Agents woken by schedules instead of a person: a nightly sweep that makes a fresh task from its template every 24 h at 02:00, and a triage loop that wakes on its own clock and works through the backlog until it is empty. Scheduled agent loops went from 2.2 to about 35 merged pull requests per day (2610.36254). The simulator fires each schedule every `every` from `next_fire_at` and applies the trigger''s policy: skip drops a firing while a run is going, queue holds it until a run ends, parallel overlaps up to `max_parallel` runs and refuses the rest. A run that finds nothing to take costs one model call. Tasks wait in the backlog between two ticks. The simulator does not model cron expressions or time zones (only a fixed interval), the restriction checks a schedule passes before it is enabled, nor what a sweep finds: a sweep is one task of the coding role, and triage does the tasks rather than sorting them.'
