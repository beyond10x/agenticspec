format: agenticspec-binding/1
binding: jobs
architecture: scheduled-loops
refines: local-scheduled-loops.yaml
summary: >-
  The scheduled loops with the nightly sweep as a scheduled unit that a clock starts and that
  ends when its run ends; everything else in the core unit.
parts:
  sweeper: {agent: ../agents/sweeper.yaml, egress: [builds, gateway, owner]}
  sweep: {egress: [sweeper]}
  gateway: {state: service}
  builds: {state: service}
transports:
  model_call: http
  claim: http
  question: a2a
packing:
  parts:
    sweeper: {schedule: job}
