format: agenticspec-binding/1
binding: operator-ui
architecture: workstation
refines: split.yaml
summary: >-
  The split workstation with its operator UI as a unit of its own: the static files of `agenticspec
  ui build` serve the operator ingress's ui export on its port, and read the adapter of the core
  unit. Its control-plane UI (`ui build --control-plane`) is a second unit beside it on a port of
  its own, reading the same adapter. A UI of the consumer's own, `console`, is a third unit from a
  static archive the consumer built (`console-ui.tar`, checked against its digest), on its port.
ui:
  operator: {}
  control-plane: {port: 8090}
  console:
    source: {archive: console-ui.tar, digest: "sha256:879ecfbd367fa94f9f585c9065a74bde9b3415dbf0b36d8de8d8b8f483ad734e"}
    export: operator.ui
    port: 8091
