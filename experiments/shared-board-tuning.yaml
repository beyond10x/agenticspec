format: agenticspec-experiment/1
experiment: shared-board-tuning
architecture: ../architectures/shared-board.yaml
profile: ../profiles/coding.yaml
horizon: 24h
seeds: 8
seed: 1

bursts:
  - { at: 0s, tasks: 40 }
  - { at: 9h, tasks: 20 }

faults:
  - { kind: principal_away, part: owner, from: 2h, for: 3h }

optimize: marked

search:
  mode: exhaustive
  limit: 64
  weights:
    tasks_correct: 10
    false_completions_shipped: -5
    owner_wait_share: -200
    cost_usd: -0.05
    queue_wait_p90_seconds: -0.01
    backlog_wait_p90_seconds: -0.001
    questions_defaulted: -1
    operator_decided_owner_questions: -1
  gates: [unreachable_parts, agent_without_model_path, trigger_without_source, invalid_concurrency, swarm_needs_agent]
