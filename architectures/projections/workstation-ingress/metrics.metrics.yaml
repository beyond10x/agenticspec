# The metric list of the metrics_scrape export of ingress `metrics` of architecture `workstation-ingress`.
# Generated by `agenticspec ingress project`; do not edit.
# Every KPI a gauge named by its catalogue id; a runtime binding may set a prefix.
format: agenticspec-metrics/1
ingress:
  architecture: workstation-ingress
  audience: monitor
  authenticated: false
  name: metrics
labels:
- architecture
- part_path
- instance
metrics:
  - name: cost_usd
    type: gauge
    help: Cost of the model messages at the list price of their model.
    unit: usd
    block: model
    status: both
  - name: owner_wait_share
    type: gauge
    help: Share of agent time spent waiting on the human owner.
    unit: share
    block: principal
    status: both
  - name: pool_utilization
    type: gauge
    help: Share of pool slot-seconds that were held.
    unit: share
    block: resource
    status: simulated
  - name: queue_wait_p90_seconds
    type: gauge
    help: 90th percentile of the time a claim waited in the queue.
    unit: seconds
    block: resource
    status: simulated
  - name: rate_limited_seconds
    type: gauge
    help: Time requests waited because an upstream was saturated.
    unit: seconds
    block: gateway
    status: simulated
