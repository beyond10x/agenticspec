format: agenticspec-architecture/1
architecture: ladder-09-factory
summary: >-
  Rung 9 of the agentic ladder. A factory: the owner designs the system that builds the
  software. A factory orchestrator hands work to teams of agents, the verifier grows with them,
  budgets on the gateway bound what may be spent, KPIs measure what the factory delivers, and
  written principles say how truth is established, how goals are pursued and checked, and how
  evidence earns completion. The simulator models the teams as one worker kind of twelve copies
  that the orchestrator hands tasks to.

parts:
  you:         { block: principal, kind: human }
  session:     { block: agent, harness: coding, acts_for: you }
  subagents:   { block: agent, harness: coding, count: 3 }
  sessions:    { block: agent, harness: coding, count: 4 }
  night:       { block: agent, harness: coding, count: 3 }
  run_a:       { block: agent, harness: coding, method: a }
  run_b:       { block: agent, harness: executor, method: b }
  swarm:       { block: agent, harness: coding, coordination: board, count: 8, start_stagger: 3s }
  verifier:    { block: agent, harness: coding, role: reviewer, strictness: strict, false_accept: 0.1, false_reject: 0.2, count: 4 }
  clock:       { block: schedule, every: 30m }
  board:       { block: channel, kind: agent_message, distribution: board }
  gateway:     { block: gateway, rate_limit_per_minute: 240 }
  model:       { block: model, route: frontier }
  repo:        { block: workspace, kind: checkout, sharing: exclusive, per: session }
  trees:       { block: workspace, kind: worktree, sharing: exclusive, per: sessions }
  base:        { block: workspace, kind: snapshot, sharing: shared_read_only }
  box:         { block: sandbox, isolation: container, egress: [gateway], per: night }
  grants:      { block: authority, kind: permissions }
  context:     { block: knowledge, kind: context_files }
  contract:    { block: knowledge, kind: contract }
  specs:       { block: work, kind: spec }
  tests:       { block: tool, category: execute, kind: test_suite }
  conformance: { block: tool, category: execute, kind: conformance_suite }
  compare:     { block: experiment, kind: comparison }
  triage:      { block: agent, harness: coding, count: 2 }
  alerts:      { block: channel, kind: notification, distribution: topic }
  on_alert:    { block: trigger, kind: on_message, channel: alerts, policy: parallel, max_parallel: 4 }
  policy:      { block: authority, kind: triage_policy }
  evidence:    { block: work, kind: evidence }
  factory:     { block: agent, harness: orchestrator }
  teams:       { block: agent, harness: coding, coordination: orchestrator, count: 12, start_stagger: 30s }
  budgets:     { block: authority, kind: budget }
  kpis:        { block: kpi, kind: delivery }
  principles:  { block: knowledge, kind: principles }

