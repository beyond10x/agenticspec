format: agenticspec-architecture/1
architecture: ladder-01-sandboxed
summary: >-
  Rung 1 of the agentic ladder. One owner at a workstation works with one agent session, in a
  sandbox because that is the default. The session reaches its checkout and the model, nothing
  else, and the owner reads every diff it proposes.

parts:
  you:     { block: principal, kind: human }
  session: { block: agent, harness: coding }
  model:   { block: model, route: frontier }
  repo:    { block: workspace, kind: checkout, sharing: exclusive, per: session }
  box:     { block: sandbox, isolation: process, egress: [model], per: session }

links:
  - { from: you,     to: session, carries: prompt }
  - { from: session, to: you,     carries: question }
  - { from: session, to: you,     carries: proposal }
  - { from: session, to: model,   carries: model_call }

border: [session]
