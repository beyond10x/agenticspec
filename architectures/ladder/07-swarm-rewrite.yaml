format: agenticspec-architecture/1
architecture: ladder-07-swarm-rewrite
summary: >-
  Rung 7 of the agentic ladder. A whole component is rewritten, not patched: the session breaks
  the rewrite into entries on a shared board and the copies of a swarm claim them one by one. An
  explicit contract says what the component does, and a conformance suite derived from it proves
  the new version does everything the old one did; the verifier rejects what the suite does not
  pass, which is why its false-accept rate is low here. The simulator does not route the work
  through the board: the swarm's copies take tasks from the shared backlog.

parts:
  you:         { block: principal, kind: human }
  session:     { block: agent, harness: coding, acts_for: you }
  subagents:   { block: agent, harness: coding, count: 3 }
  sessions:    { block: agent, harness: coding, count: 4 }
  night:       { block: agent, harness: coding, count: 3 }
  run_a:       { block: agent, harness: coding, method: a }
  run_b:       { block: agent, harness: executor, method: b }
  swarm:       { block: agent, harness: coding, coordination: board, count: 8, start_stagger: 3s }
  verifier:    { block: agent, harness: coding, role: reviewer, strictness: strict, false_accept: 0.1, false_reject: 0.2, count: 2 }
  clock:       { block: schedule, every: 30m }
  board:       { block: channel, kind: agent_message, distribution: board }
  gateway:     { block: gateway, rate_limit_per_minute: 240 }
  model:       { block: model, route: frontier }
  repo:        { block: workspace, kind: checkout, sharing: exclusive, per: session }
  trees:       { block: workspace, kind: worktree, sharing: exclusive, per: sessions }
  base:        { block: workspace, kind: snapshot, sharing: shared_read_only }
  box:         { block: sandbox, isolation: container, egress: [gateway], per: night }
  grants:      { block: authority, kind: permissions }
  context:     { block: knowledge, kind: context_files }
  contract:    { block: knowledge, kind: contract }
  specs:       { block: work, kind: spec }
  tests:       { block: tool, category: execute, kind: test_suite }
  conformance: { block: tool, category: execute, kind: conformance_suite }
  compare:     { block: experiment, kind: comparison }

links:
  - { from: you,       to: session,     carries: prompt }
  - { from: session,   to: you,         carries: question }
  - { from: session,   to: you,         carries: proposal }
  - { from: session,   to: gateway,     carries: model_call }
  - { from: session,   to: subagents,   carries: order }
  - { from: subagents, to: session,     carries: question }
  - { from: subagents, to: gateway,     carries: model_call }
  - { from: subagents, to: tests,       carries: call }
  - { from: context,   to: subagents,   carries: context }
  - { from: you,       to: specs,       carries: spec }
  - { from: specs,     to: sessions,    carries: spec }
  - { from: sessions,  to: you,         carries: question }
  - { from: sessions,  to: gateway,     carries: model_call }
  - { from: sessions,  to: tests,       carries: call }
  - { from: sessions,  to: verifier,    carries: review }
  - { from: context,   to: sessions,    carries: context }
  - { from: clock,     to: night,       carries: trigger }
  - { from: night,     to: you,         carries: question }
  - { from: night,     to: gateway,     carries: model_call }
  - { from: night,     to: tests,       carries: call }
  - { from: night,     to: verifier,    carries: review }
  - { from: grants,    to: night,       carries: grant }
  - { from: grants,    to: sessions,    carries: grant }
  - { from: verifier,  to: gateway,     carries: model_call }
  - { from: gateway,   to: model,       carries: model_call }
  - { from: base,      to: run_a,       carries: checkout }
  - { from: base,      to: run_b,       carries: checkout }
  - { from: run_a,     to: gateway,     carries: model_call }
  - { from: run_b,     to: gateway,     carries: model_call }
  - { from: run_a,     to: compare,     carries: result }
  - { from: run_b,     to: compare,     carries: result }
  - { from: compare,   to: you,         carries: report }
  - { from: session,   to: board,       carries: message }
  - { from: swarm,     to: board,       carries: claim }
  - { from: swarm,     to: session,     carries: question }
  - { from: swarm,     to: gateway,     carries: model_call }
  - { from: swarm,     to: conformance, carries: call }
  - { from: swarm,     to: verifier,    carries: review }
  - { from: contract,  to: swarm,       carries: context }
  - { from: contract,  to: conformance, carries: context }

border: [session]

policies:
  question_default_after: 15m
  operator_answers_alone: false
