format: agenticspec-architecture/1
architecture: ladder-05-scheduled
summary: >-
  Rung 5 of the agentic ladder. Work goes on after the owner logs off: a clock wakes night agents
  every 30 minutes and they work through the backlog. Nobody reads their diffs as they happen, so
  a harness takes over: the sandbox is back for the unattended agents, grants say what each may
  do, every model call passes one gateway, and a verifier checks each finished task.

parts:
  you:       { block: principal, kind: human }
  session:   { block: agent, harness: coding, role: operator, acts_for: you }
  subagents: { block: agent, harness: coding, count: 3 }
  sessions:  { block: agent, harness: coding, count: 4 }
  night:     { block: agent, harness: coding, count: 3 }
  verifier:  { block: agent, harness: coding, role: reviewer, strictness: strict }
  clock:     { block: schedule, every: 30m }
  gateway:   { block: gateway, rate_limit_per_minute: 120 }
  model:     { block: model, route: frontier }
  repo:      { block: workspace, kind: checkout, sharing: exclusive, per: session }
  trees:     { block: workspace, kind: worktree, sharing: exclusive, per: sessions }
  box:       { block: sandbox, isolation: container, egress: [gateway], per: night }
  grants:    { block: authority, kind: permissions }
  context:   { block: knowledge, kind: context_files }
  specs:     { block: work, kind: spec }
  tests:     { block: tool, category: execute, kind: test_suite }

links:
  - { from: you,       to: session,   carries: prompt }
  - { from: session,   to: you,       carries: question }
  - { from: session,   to: you,       carries: proposal }
  - { from: session,   to: gateway,   carries: model_call }
  - { from: session,   to: subagents, carries: order }
  - { from: subagents, to: session,   carries: question }
  - { from: subagents, to: gateway,   carries: model_call }
  - { from: subagents, to: tests,     carries: call }
  - { from: context,   to: subagents, carries: context }
  - { from: you,       to: specs,     carries: spec }
  - { from: specs,     to: sessions,  carries: spec }
  - { from: sessions,  to: you,       carries: question }
  - { from: sessions,  to: gateway,   carries: model_call }
  - { from: sessions,  to: tests,     carries: call }
  - { from: sessions,  to: verifier,  carries: review }
  - { from: context,   to: sessions,  carries: context }
  - { from: clock,     to: night,     carries: trigger }
  - { from: night,     to: you,       carries: question }
  - { from: night,     to: gateway,   carries: model_call }
  - { from: night,     to: tests,     carries: call }
  - { from: night,     to: verifier,  carries: review }
  - { from: grants,    to: night,     carries: grant }
  - { from: grants,    to: sessions,  carries: grant }
  - { from: verifier,  to: gateway,   carries: model_call }
  - { from: gateway,   to: model,     carries: model_call }

border: [session]

policies:
  question_default_after: 15m
  operator_answers_alone: false
