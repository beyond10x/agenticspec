format: agenticspec-architecture/1
architecture: planner-executor
summary: >-
  One planner agent writes a plan for every task and posts it to a queue; executor agents, woken
  by each post, take the plans in order. With a plan before the first change, resolved rose from
  50.2% to 65.0% while the planner used under 2% of the executor's tokens (2610.29870); a plan
  preceded every first change in 23 of 23 runs (2610.35992). The simulator gives the planner the
  profile role `planner` (one turn per task) and the executors the role `executor`, whose pass rate
  after a failed step is set so that the share of correct tasks rises by the ratio of 2610.29870:
  the gain of a plan is an input of the run, not a result of it. A post that finds every executor
  busy is offered again when a run ends. The simulator does not model a wrong plan, an executor
  that departs from its plan, plans that depend on each other, nor a planner that learns from
  failed runs.

parts:
  owner:    { block: principal, kind: human }
  planner:  { block: agent, harness: planner, count: { value: 1, vary: [1, 2] } }
  plans:    { block: channel, kind: agent_message, distribution: queue }
  on_plan:  { block: trigger, kind: on_message, channel: plans, policy: parallel, max_parallel: { value: 8, vary: [4, 8, 12] } }
  executor: { block: agent, harness: executor, count: { value: 8, vary: [4, 8, 12] } }
  gateway:  { block: gateway, rate_limit_per_minute: 120 }
  model:    { block: model, route: frontier }
  builds:   { block: pool, kind: build_slots, capacity: 16, job_limit: 10m }
  tree:     { block: workspace, sharing: exclusive, per: executor }

links:
  - { from: owner,    to: planner,  carries: prompt }
  - { from: planner,  to: plans,    carries: message }
  - { from: on_plan,  to: executor, carries: trigger }
  - { from: executor, to: owner,    carries: question }
  - { from: planner,  to: gateway,  carries: model_call }
  - { from: executor, to: gateway,  carries: model_call }
  - { from: gateway,  to: model,    carries: model_call }
  - { from: executor, to: builds,   carries: claim }

policies:
  question_default_after: 15m
