format: agenticspec-architecture/1
architecture: parallel-unaware
summary: >-
  Two agents work in parallel and have no channel between them. In 2611.00314 this topology solved
  16% of tasks, against 62% for one agent with both tasks; a broadcast channel between parallel
  agents lowered results too (2609.40303). The simulator does not model work that conflicts or
  repeats: both agents take tasks from one backlog and each task's success comes from the profile's
  step chain, so a run shows the gain in throughput and none of the loss.

parts:
  owner: { block: principal, kind: human }
  a:     { block: agent, harness: coding }
  b:     { block: agent, harness: coding }
  model: { block: model, route: frontier }

links:
  - { from: owner, to: a, carries: prompt }
  - { from: owner, to: b, carries: prompt }
  - { from: a, to: owner, carries: question }
  - { from: b, to: owner, carries: question }
  - { from: a, to: model, carries: model_call }
  - { from: b, to: model, carries: model_call }

policies:
  question_default_after: 15m
