version: '3'

tasks:
  check:
    desc: Run the repository gate.
    cmds:
      - task: check:spec
      - task: check:blocks
      - task: check:fields
      - task: check:ui
      - task: check:app
      - task: check:generated
      - task: check:docs
      - task: check:ladder
      - task: check:site
      - task: check:scripts
      - task: check:rust
      - task: test

  check:blocks:
    desc: Validate the building blocks (blocks/) and the agenticstudio system (studio/), hold their layering, and run their conformance suite, authored scenarios included, on the interpreter. The suite is synthesized once per digest of its sources into target/blocks-conform/ (scripts/check-blocks-conform.sh).
    cmds:
      - ess specify validate --path blocks --strict-requires
      - ess specify validate --path studio --strict-requires
      - task: check:layers
      - task: check:kpis
      - scripts/check-blocks-conform.sh

  slow:blocks:
    desc: Slow lane. Synthesize the conformance suite of blocks/ afresh, compare it byte for byte with the cached suite of the same digest, and run it.
    cmds:
      - scripts/check-blocks-conform.sh --slow

  check:fields:
    desc: Validate the whole system (the core and the packs, from the root ess-inputs.yaml), hold the pack and field manifests against it and keep product names out of packs/ and fields/ (scripts/check-packs.sh), run its conformance suite with the packs' authored scenarios on the interpreter (synthesized once per digest into target/system-conform/, scripts/check-blocks-conform.sh --path .), and check every architecture a field lists with agenticspec sim check.
    cmds:
      - ess specify validate --path . --strict-requires
      - scripts/check-packs.sh
      - scripts/check-blocks-conform.sh --path .
      - cargo build --quiet --locked -p agenticspec
      - |
        set -eu
        for manifest in fields/*/field.yaml; do
          dir=${manifest%/field.yaml}
          for a in $(yq '.architectures // [] | .[]' "$manifest"); do
            printf 'check:fields: %s/%s ' "$dir" "$a"
            target/debug/agenticspec sim check "$dir/$a"
          done
        done

  slow:fields:
    desc: Slow lane. Synthesize the conformance suite of the whole system afresh, compare it byte for byte with the cached suite of the same digest, and run it.
    cmds:
      - scripts/check-blocks-conform.sh --path . --slow

  check:kpis:
    desc: Check kpis/catalogue.yaml and every packs/<pack>/kpis.yaml against their format, their blocks and the events they may read.
    cmds:
      - scripts/check-kpis.sh

  check:layers:
    desc: Fail when a block depends on a block of a higher layer, two blocks of one layer depend on each other, a core block depends on a pack or field, a pack on a field or an undeclared pack, or a field on another field; for blocks/ and for the whole system. Then each fixture under scripts/fixtures/layers must fail and each under scripts/fixtures/layers-pass must pass.
    cmds:
      - scripts/check-layers.sh
      - scripts/check-layers.sh --path .
      - scripts/check-layers.sh --negative
      - scripts/check-layers.sh --positive

  layers:graph:
    desc: Print the dependency graph between blocks with counts, then the layer check.
    cmds:
      - scripts/check-layers.sh --graph

  docs:generate:
    desc: Write the generated pages of the docs site (docs/blocks/, docs/architectures/, docs/kpis-catalogue.md, website/static/architectures/, website/src/generated/) from blocks/, kpis/catalogue.yaml, architectures/ and experiments/.
    cmds:
      - cargo build --quiet --locked -p agenticspec-docs
      - target/debug/agenticspec-docs --root .

  catalog:generate:
    desc: Run every experiment under experiments/ at its own budget and seeds and write the committed result of its catalog entry, website/static/catalog/<entry>/result.json, with the digest of its sources beside it (sources.sha256). Run task docs:generate after it.
    cmds:
      - cargo build --quiet --locked -p agenticspec-docs
      - target/debug/agenticspec-docs --root . --results

  slow:catalog:
    desc: Slow lane. Run every experiment of the catalog afresh and compare its result and digest file byte for byte with the committed ones.
    cmds:
      - cargo build --quiet --locked -p agenticspec-docs
      - target/debug/agenticspec-docs --root . --results --check

  check:docs:
    desc: Fail when a generated page of the docs site differs from a fresh generation, is missing or is not generated; names the files.
    cmds:
      - cargo build --quiet --locked -p agenticspec-docs
      - target/debug/agenticspec-docs --root . --check

  ladder:generate:
    desc: Check the agentic ladder (ladder/ladder.yaml and its rungs in architectures/ladder/) and write the data file of its page, website/static/ladder/ladder.json.
    cmds:
      - cargo build --quiet --locked -p agenticspec
      - target/debug/agenticspec sim ladder ladder/ladder.yaml --out website/static/ladder/ladder.json

  check:ladder:
    desc: Fail when the agentic ladder is refused or website/static/ladder/ladder.json differs from a fresh generation.
    cmds:
      - cargo build --quiet --locked -p agenticspec
      - target/debug/agenticspec sim ladder ladder/ladder.yaml --out website/static/ladder/ladder.json --check

  check:scripts:
    desc: Run every script test, scripts/*.test.sh.
    cmds:
      - |
        set -eu
        n=0
        for t in scripts/*.test.sh; do
          [ -f "$t" ] || { echo "check:scripts: no scripts/*.test.sh"; exit 1; }
          echo "check:scripts: sh $t"
          sh "$t"
          n=$((n + 1))
        done
        echo "check:scripts: $n script test(s) passed"

  site:
    desc: Build the documentation site (website/, pages read in place from docs/) into website/build, as the job build of .github/workflows/pages.yml does.
    dir: website
    cmds:
      - npm ci
      - npm run build

  check:spec:
    desc: Validate the specification and synthesize its conformance suite with no refusal.
    cmds:
      - ess specify validate --path spec
      - mkdir -p target/spec && ess verify conform synthesize --path spec --out target/spec/suite.json

  check:ui:
    desc: Check the ess-ui document against the specification and run its headless tests on the fixtures.
    cmds:
      - ess ui check --path ui/agenticspec.ui.yaml --model spec
      - ess ui test --path ui/agenticspec.ui.yaml ui/tests/session.yaml

  check:app:
    desc: Types, unit tests and a build of the app in ui/app, then its layout, accessibility, keyboard and screen-only-user gates on the fixtures and the ratchet against ux/baseline.json. The lines are in scripts/check-app.sh.
    cmds:
      - sh scripts/check-app.sh

  ux:round:
    desc: Measure a round of the ui-iteration-loop into ux/rounds/R-nn (task ux:round -- R-nn). The lines are in ux/round.sh.
    cmds:
      - sh ux/round.sh {{.CLI_ARGS}}

  check:site:
    desc: Build the docs site into website/build when its inputs changed or there is none, then its layout, accessibility, keyboard, screen-only-user and page-sweep gates and the ratchet against ux/site/baseline.json. The lines are in scripts/check-site.sh.
    cmds:
      - sh scripts/check-site.sh

  ux:site-round:
    desc: Measure a round of the ui-iteration-loop of the docs site into ux/site/rounds/S-nn (task ux:site-round -- S-nn). The lines are in ux/site/round.sh.
    cmds:
      - sh ux/site/round.sh {{.CLI_ARGS}}

  check:generated:
    desc: Compare each generated directory, byte for byte, with a fresh generation. The lines are in scripts/check-generated.sh.
    cmds:
      - sh scripts/check-generated.sh

  generate:
    desc: Replace each generated directory with a fresh generation. A generated file is never edited.
    cmds:
      - sh scripts/check-generated.sh --write

  check:rust:
    desc: Format and lints of the hand-written crates.
    cmds:
      - cargo fmt --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    desc: Tests with cargo-nextest; .config/nextest.toml ends a test at 60 s and the run at 120 s.
    cmds:
      - cargo nextest run --workspace --locked

  ui:build:
    desc: Build the hand-written app of ui/app into target/ui/www, which `agenticspec serve` serves. The lines are in scripts/ui-build.sh.
    cmds:
      - sh scripts/ui-build.sh

  sync:
    desc: Lift the new and changed Claude Code sessions of the last 72 hours into the local store.
    cmds:
      - cargo run --release --locked -p agenticspec -- sync

  serve:
    desc: Serve the UI and its views from the local store on http://127.0.0.1:7420, synced every 5 seconds.
    cmds:
      - cargo run --release --locked -p agenticspec -- serve

  analyze:
    desc: Write agenticspec-dashboard.html for the Claude Code sessions of the last 72 hours on this host.
    cmds:
      - cargo run --release --locked -p agenticspec -- analyze

  kpi:
    desc: KPIs over the Claude Code sessions of the last 72 hours on this host.
    cmds:
      - cargo run --release --locked -p agenticspec -- kpi --output json
