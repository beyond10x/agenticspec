# Broken variant: the workstation with the workers asking their questions to the build pool.
# Only a principal or an agent part answers, so the link is refused.
type: ess-scenario/7
domain: agentic.architecture
scenario: workstation-question-to-pool
summary: A link carrying questions from the workers to the build pool is refused, because a pool cannot answer.

arrange:
  - instance: ws
    entity: agentic.architecture.Architecture

timeline:
  - at: 2026-11-27T09:00:00Z
    command: agentic.architecture.CreateArchitecture
    input: {name: workstation}
    outcome: created
    capture: {instance: ws, event: agentic.architecture.ArchitectureCreated, field: architecture_id}

  # parts
  - at: 2026-11-27T09:00:01Z
    command: agentic.architecture.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000001
      architecture_id: {$instance: ws}
      name: owner
      kind: Principal
      count: 1
      settings: [{name: principal_kind, value: human}]
    outcome: added
  - at: 2026-11-27T09:00:02Z
    command: agentic.architecture.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000002
      architecture_id: {$instance: ws}
      name: operator
      kind: Agent
      count: 1
      settings: [{name: harness, value: coding}]
    outcome: added
  - at: 2026-11-27T09:00:03Z
    command: agentic.architecture.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000003
      architecture_id: {$instance: ws}
      name: worker
      kind: Agent
      count: 12
      settings: [{name: harness, value: coding}]
    outcome: added
  - at: 2026-11-27T09:00:04Z
    command: agentic.architecture.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000004
      architecture_id: {$instance: ws}
      name: gateway
      kind: Gateway
      count: 1
      settings: [{name: upstreams, value: provider}]
    outcome: added
  - at: 2026-11-27T09:00:05Z
    command: agentic.architecture.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000005
      architecture_id: {$instance: ws}
      name: builds
      kind: Pool
      count: 1
      settings: [{name: slots, value: "16"}]
    outcome: added
  - at: 2026-11-27T09:00:06Z
    command: agentic.architecture.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000006
      architecture_id: {$instance: ws}
      name: chat
      kind: Channel
      count: 1
      settings: [{name: kind, value: operator}]
    outcome: added
  - at: 2026-11-27T09:00:07Z
    command: agentic.architecture.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000007
      architecture_id: {$instance: ws}
      name: tree
      kind: Workspace
      count: 1
      settings: [{name: sharing, value: exclusive}]
    outcome: added
  - at: 2026-11-27T09:00:08Z
    command: agentic.architecture.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000008
      architecture_id: {$instance: ws}
      name: box
      kind: Sandbox
      count: 1
      settings: [{name: egress, value: gateway}]
    outcome: added

  - at: 2026-11-27T09:00:09Z
    command: agentic.architecture.AddLink
    input:
      architecture_id: {$instance: ws}
      from_part_id: 00000000-0000-4000-8000-000000000003
      to_part_id: 00000000-0000-4000-8000-000000000005
      carries: Question
    outcome: target-cannot-answer
    error:
      name: agentic.architecture.TargetCannotAnswer
    no_events: [agentic.architecture.LinkAdded]

assert:
  - view: agentic.architecture.Reach
    params:
      architecture_id: {$instance: ws}
    counts:
      at_most: 0
