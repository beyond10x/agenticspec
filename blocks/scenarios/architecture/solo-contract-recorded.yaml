# The contract of a committed revision. Synthesis cannot arrange a committed revision (the
# witness of CommitRevision/committed is a row set), so this scenario commits one: the smallest
# architecture the commit accepts, one agent with a link carrying model calls to one model. Its
# contract names the agent's session port and the model's inference port, the routing invariant
# of the one link and an empty border. A second contract of the same revision is refused, and so
# is a contract with no port.
type: ess-scenario/7
domain: agentic.architecture
scenario: solo-contract-recorded
summary: A committed revision takes one contract; a second one and one with no port are refused.

arrange:
  - instance: solo
    entity: agentic.architecture.Architecture
  - instance: link
    entity: agentic.architecture.Link
  - instance: rev
    entity: agentic.architecture.ArchitectureRevision

timeline:
  - at: 2026-11-28T09:00:00Z
    command: agentic.architecture.CreateArchitecture
    input: {name: solo}
    outcome: created
    capture: {instance: solo, event: agentic.architecture.ArchitectureCreated, field: architecture_id}

  - at: 2026-11-28T09:00:01Z
    command: agentic.architecture.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000101
      architecture_id: {$instance: solo}
      name: agent
      kind: Agent
      count: 1
      settings: [{name: harness, value: coding}]
    outcome: added
  - at: 2026-11-28T09:00:02Z
    command: agentic.architecture.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000102
      architecture_id: {$instance: solo}
      name: model
      kind: Model
      count: 1
      settings: [{name: route, value: frontier}]
    outcome: added
  - at: 2026-11-28T09:00:03Z
    command: agentic.architecture.AddLink
    input:
      architecture_id: {$instance: solo}
      from_part_id: 00000000-0000-4000-8000-000000000101
      to_part_id: 00000000-0000-4000-8000-000000000102
      carries: ModelCall
    outcome: added
    capture: {instance: link, event: agentic.architecture.LinkAdded, field: link_id}

  - at: 2026-11-28T09:00:04Z
    command: agentic.architecture.CommitRevision
    input:
      architecture_id: {$instance: solo}
    outcome: committed
    capture: {instance: rev, event: agentic.architecture.RevisionCommitted, field: revision_id}

  - at: 2026-11-28T09:00:05Z
    command: agentic.architecture.RecordContract
    input:
      revision_id: {$instance: rev}
      ports: []
      invariants: []
      border: []
    outcome: empty
    error:
      name: agentic.architecture.EmptyContract
    no_events: [agentic.architecture.ContractRecorded]

  - at: 2026-11-28T09:00:06Z
    command: agentic.architecture.RecordContract
    input:
      revision_id: {$instance: rev}
      ports:
        - port_id: 00000000-0000-4000-8000-000000000201
          part_id: 00000000-0000-4000-8000-000000000101
          settings: [{name: harness, value: coding}]
          instances: 1
        - port_id: 00000000-0000-4000-8000-000000000202
          part_id: 00000000-0000-4000-8000-000000000102
          settings: [{name: route, value: frontier}]
          instances: 1
      invariants:
        - link_id: {$instance: link}
          port_id: 00000000-0000-4000-8000-000000000202
          predicate: every model.infer of agent is a call of model
      border: []
    outcome: recorded
    events:
      - event: agentic.architecture.ContractRecorded
        payload: {revision_id: {$instance: rev}}

  - at: 2026-11-28T09:00:07Z
    command: agentic.architecture.RecordContract
    input:
      revision_id: {$instance: rev}
      ports:
        - port_id: 00000000-0000-4000-8000-000000000201
          part_id: 00000000-0000-4000-8000-000000000101
          settings: []
          instances: 1
      invariants: []
      border: []
    outcome: contract-exists
    error:
      name: agentic.architecture.ContractExists
    no_events: [agentic.architecture.ContractRecorded]

assert:
  - view: agentic.architecture.Contracts
    params:
      revision_id: {$instance: rev}
    counts:
      at_least: 1
      at_most: 1
  - view: agentic.architecture.Contracts
    params:
      revision_id: {$instance: rev}
    contains:
      revision_id: {$instance: rev}
