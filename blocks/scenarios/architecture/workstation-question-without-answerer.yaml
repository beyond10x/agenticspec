# Broken variant: the workstation with the operator acting for nobody (no `acts_for: owner`).
# The workers ask the operator, an agent part that acts for no principal, so no party may
# answer their questions and the commit is refused.
type: ess-scenario/7
domain: agentic.architecture
scenario: workstation-question-without-answerer
summary: The workstation whose operator acts for no principal is refused at commit, because the workers questions have no party that may answer.

arrange:
  - instance: ws
    entity: agentic.architecture.Architecture

timeline:
  - at: 2026-11-27T09:00:00Z
    command: agentic.architecture.CreateArchitecture
    input: {name: workstation}
    outcome: created
    capture: {instance: ws, event: agentic.architecture.ArchitectureCreated, field: architecture_id}

  # parts
  - at: 2026-11-27T09:00:01Z
    command: agentic.architecture.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000001
