# A question past its deadline takes its default (design/building-blocks.md, "Guards carry the
# rules"). Synthesis does not advance the clock past a stored deadline (ESS-SYNTH-003), so this
# scenario walks it by hand. One question is answered before its deadline. Another is answered
# after its deadline: the answer is refused, the question stays Open, and the clock takes its
# default. The interpreter's clock is the time of the run, so the passed deadline lies in the past
# of any run and the one ahead far in its future.
type: ess-scenario/7
domain: agentic.question
scenario: answer-after-deadline
summary: An answer before the deadline is taken; an answer after it is refused and the default is taken.

arrange:
  - instance: early
    entity: agentic.question.Question
  - instance: late
    entity: agentic.question.Question

timeline:
  - at: 2026-01-15T10:00:00Z
    command: agentic.question.Ask
    actor: agentic.question.Asker
    caller: {party: 00000000-0000-4000-8000-0000000005a1}
    input:
      addressee: 00000000-0000-4000-8000-0000000005b1
      kind: Choice
      text: {digest: sha256-early, length: 40, class: prompt}
      options:
        - {letter: A, label: ship, meaning: Choice}
        - {letter: B, label: hold, meaning: Choice}
      default_option: B
      deadline: 2999-12-31T00:00:00Z
    outcome: asked
    capture: {instance: early, event: agentic.question.QuestionAsked, field: question_id}

  - at: 2026-01-15T10:00:01Z
    command: agentic.question.Ask
    actor: agentic.question.Asker
    caller: {party: 00000000-0000-4000-8000-0000000005a1}
    input:
      addressee: 00000000-0000-4000-8000-0000000005b1
      kind: Choice
      text: {digest: sha256-late, length: 40, class: prompt}
      options:
        - {letter: A, label: ship, meaning: Choice}
        - {letter: B, label: hold, meaning: Choice}
      default_option: B
      deadline: 2026-01-15T10:05:00Z
    outcome: asked
    capture: {instance: late, event: agentic.question.QuestionAsked, field: question_id}

  - at: 2026-01-15T10:04:59Z
    command: agentic.question.Answer
    actor: agentic.question.Answerer
    caller: {party: 00000000-0000-4000-8000-0000000005b1}
    input: {question_id: {$instance: early}, option: A}
    outcome: answered

  - at: 2026-01-15T10:05:00Z
    command: agentic.question.Answer
    actor: agentic.question.Answerer
    caller: {party: 00000000-0000-4000-8000-0000000005b1}
    input: {question_id: {$instance: late}, option: A}
    outcome: deadline-passed
    error:
      name: agentic.question.DeadlinePassed
    no_events: [agentic.question.QuestionAnswered]

  - at: 2026-01-15T10:05:01Z
    command: agentic.question.TakeDefault
    actor: agentic.question.Clock
    input: {question_id: {$instance: late}}
    outcome: taken
    events:
      - event: agentic.question.DefaultTaken
        payload: {question_id: {$instance: late}, option: B}

assert:
  - view: agentic.question.Questions
    contains:
      question_id: {$instance: early}
      chosen: A
      state: Answered
  - view: agentic.question.Questions
    contains:
      question_id: {$instance: late}
      chosen: B
      state: DefaultTaken
