# Deployment: an architecture revision brought to a runtime, and the runs it serves. It sits beside
# agentic.architecture (layer 9) because an installation names an architecture revision, which no
# block below layer 9 may name. Source: design/architecture-runtime.md (the binding, the smallest
# first runtime) and the run lifecycle, pinning, idempotency, install, drain and rollback a
# consumer's review asked for (M29, M30, M32, M33); the deployment of a revision onto a target
# through its bundle, its translation and its realization (docs/deployment.md).
domain: agentic.deployment

summary: >-
  An architecture revision brought to a runtime, and the runs it serves. An installation puts one
  architecture revision on one runtime with a binding (which concrete thing plays each part); a
  runtime holds one Active installation at a time. Draining takes no new run and lets the runs it
  holds end; a rollback ends the current installation and makes the one it replaced Active again.
  An architecture run is one run of an installation for one subject: queued, running, waiting, and
  done, failed or cancelled. It keeps the revision and binding of the installation it was queued
  on, so a newer revision never changes a run already queued. The caller names a run's identity
  once per intent; a repeat with the same identity starts nothing. A deployment brings one
  revision onto one scope of a target: agenticspec admits it with its contract, binding and
  packing and writes its bundle (`agenticspec-deployment/1`), a translator turns the bundle into
  its target's architecture, and the target realizes it and reports how its units run. It
  records each step by digest and its target and scope by value, as ESS declares no relation
  across systems. A request is refused before anything is recorded when the revision is not
  released (an in-process run takes a draft), when admission names findings, or when the scope is
  taken; a recorded deployment is refused later by its translator's coverage or by its target,
  each by name with its findings.

naming:
  wire: deployment
  display: Deployment

types:
  - name: agentic.deployment.BindingDigest
    kind: newtype
    of: String
    naming:
      summary: >-
        Digest of the binding document (agenticspec-binding/1) that says which concrete thing plays
        each part of the architecture on this runtime.

  - name: agentic.deployment.WaitReason
    kind: enum
    variants: [Approval, Answer, Resource, Requested]
    naming:
      summary: "Why a run waits: on a decision, on a principal's answer, on a shared resource, or because it was asked to. Carried by the event, not stored on the run."

  - name: agentic.deployment.CancelReason
    kind: enum
    variants: [Requested, Replaced, RolledBack]
    naming:
      summary: >-
        Why a run was cancelled: a principal asked for it, a trigger's Replace policy started
        another run for its subject, or its installation was rolled back. Recorded as the caller
        states it; no guard checks it.

  - name: agentic.deployment.UnitKind
    kind: enum
    variants: [Core, Agent, Service, Job, Scheduled, Store, Model]

  - name: agentic.deployment.Refusal
    kind: enum
    variants: [CoverageRefused, TargetRefused]
    naming:
      summary: Why a recorded deployment was refused after its bundle was handed over.

  - name: agentic.deployment.Finding
    kind: struct
    naming:
      summary: One finding of a refusal, by the name of its rule, with what it is about.
    fields:
      - {name: name, type: String}
      - {name: detail, type: String}

entities:
  # UNMAPPED: the binding (agenticspec-binding/1, docs/deployment.md) is admitted by agenticspec
  # before a bundle is written, outside the blocks. Its digest is a claim of the deployer; no
  # guard reads the binding or checks it against the revision's parts.
  - name: agentic.deployment.Installation
    naming:
      summary: >-
        One architecture revision put on one runtime with a binding. Active while it takes runs;
        Draining takes no new run; Drained once its last run ended; RolledBack when a rollback
        ended it. It names the installation it replaced, which a rollback makes Active again.
    identity:
      name: installation_id
      type: agentic.shared.InstallationId
    fields:
      - name: runtime_id
        type: agentic.shared.RuntimeId
      - name: revision_id
        type: agentic.shared.ArchitectureRevisionId
      - name: binding
        type: agentic.deployment.BindingDigest
      - name: replaces
        type: Optional<agentic.shared.InstallationId>
        summary: The installation of the same runtime this one took over from; a rollback returns to it.
      - name: installed_at
        type: Timestamp
    relations:
      - {name: runtime, kind: references, target: agentic.runtime.Runtime, cardinality: one, via: runtime_id}
      - {name: revision, kind: references, target: agentic.architecture.ArchitectureRevision, cardinality: one, via: revision_id}
      - {name: replaced, kind: references, target: agentic.deployment.Installation, cardinality: one, via: replaces}
    lifecycle:
      initial: Active
      states:
        - {name: Active, summary: "Takes new runs."}
        - {name: Draining, summary: "Takes no new run; the runs it holds go on until they end."}
        - {name: Drained, summary: "Draining ended with no run left that has not ended."}
        - {name: RolledBack, summary: "A rollback ended it; it takes no run, and its runs keep their revision."}
      terminal: [RolledBack]
      transitions:
        - {name: drain, from: [Active], to: Draining, summary: "The deployer drains it (DrainInstallation)."}
        - {name: finish_drain, from: [Draining], to: Drained, summary: "The runner reports it drained once every run of it ended (ReportDrained)."}
        - {name: roll_back, from: [Active], to: RolledBack, summary: "The deployer rolls it back (RollBack)."}
        - {name: reactivate, from: [Draining, Drained], to: Active, summary: "The installation a rolled-back one replaced takes runs again."}

  # A run of an installation. `revision_id` and `binding` are read from the installation when the
  # run is queued and no command changes them: a run keeps the revision it was queued under, and a
  # newer installation on the same runtime leaves it as it is (M30).
  - name: agentic.deployment.ArchitectureRun
    naming:
      summary: >-
        One run of an installed architecture revision for one subject, pinned to the revision and
        binding of its installation. Queued, then Running and Waiting in turn, and Done, Failed or
        Cancelled once.
    identity:
      name: run_id
      type: agentic.shared.ArchitectureRunId
    fields:
      - name: installation_id
        type: agentic.shared.InstallationId
      - name: revision_id
        type: agentic.shared.ArchitectureRevisionId
        summary: The architecture revision of its installation when it was queued.
      - name: binding
        type: agentic.deployment.BindingDigest
        summary: The binding of its installation when it was queued.
      - name: subject_key
        type: Optional<String>
        summary: What the run is for (the subject of the event or the firing that started it), so runs of one subject can be found.
      - name: task_id
        type: Optional<agentic.shared.TaskId>
        summary: The task the run works on; the agent runs of that task are its work (agentic.work Run).
      - name: queued_at
        type: Timestamp
      - name: failure
        type: Optional<String>
        summary: Why it failed, as the runner reports it.
      - name: cancelled_for
        type: Optional<agentic.deployment.CancelReason>
    relations:
      - {name: installation, kind: references, target: agentic.deployment.Installation, cardinality: one, via: installation_id}
      - {name: revision, kind: references, target: agentic.architecture.ArchitectureRevision, cardinality: one, via: revision_id}
      - {name: task, kind: references, target: agentic.work.Task, cardinality: one, via: task_id}
    lifecycle:
      initial: Queued
      states:
        - {name: Queued, summary: "Taken by its installation, not started."}
        - {name: Running, summary: "Doing its work."}
        - {name: Waiting, summary: "Waiting on a decision, an answer, a resource or a request."}
        - {name: Done, summary: "Reached the end of what it was asked."}
        - {name: Failed, summary: "Could not go on."}
        - {name: Cancelled, summary: "Stopped before it ended, by a principal or by the runner."}
      terminal: [Done, Failed, Cancelled]
      transitions:
        - {name: start, from: [Queued], to: Running, summary: "The runner starts it (StartRun)."}
        - {name: wait, from: [Running], to: Waiting, summary: "The runner records what it waits on (WaitRun)."}
        - {name: resume, from: [Waiting], to: Running, summary: "The runner resumes it (ResumeRun)."}
        - {name: finish, from: [Running], to: Done, summary: "The runner reports it done (FinishRun)."}
        - {name: fail, from: [Queued, Running, Waiting], to: Failed, summary: "The runner reports it failed (FailRun)."}
        - {name: cancel, from: [Queued, Running, Waiting], to: Cancelled, summary: "A requester or the runner cancels it (CancelRun)."}
  - name: agentic.deployment.Deployment
    naming:
      summary: One architecture revision on one target, from its request to its end.
    identity:
      name: deployment_id
      type: agentic.shared.DeploymentId
    fields:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - name: revision_id
        type: Optional<agentic.shared.ArchitectureRevisionId>
        summary: The released revision; absent only for an in-process run of a draft.
      - name: in_process
        type: Boolean
        summary: The run is the in-process runtime of the local test, which needs no release.
      - {name: target, type: agentic.shared.Name}
      - {name: scope, type: agentic.shared.Name}
      - {name: contract_digest, type: agentic.architecture.Digest}
      - {name: binding_digest, type: agentic.architecture.Digest}
      - {name: packing_digest, type: agentic.architecture.Digest}
      - {name: bundle_digest, type: Optional<agentic.architecture.Digest>}
      - {name: translation_digest, type: Optional<agentic.architecture.Digest>}
      - name: promoted_from
        type: Optional<agentic.shared.DeploymentId>
        summary: The deployment of the same revision this one was promoted from.
      - {name: refusal, type: Optional<agentic.deployment.Refusal>}
      - {name: findings, type: List<agentic.deployment.Finding>}
      - {name: reason, type: Optional<String>}
    relations:
      - {name: architecture, kind: references, target: agentic.architecture.Architecture, cardinality: one, via: architecture_id}
      - {name: revision, kind: references, target: agentic.architecture.ArchitectureRevision, cardinality: one, via: revision_id}
      - {name: promoted, kind: references, target: agentic.deployment.Deployment, cardinality: one, via: promoted_from}
      - {name: units, kind: owns, target: agentic.deployment.DeploymentUnit, cardinality: many, via: deployment_id}
    lifecycle:
      initial: Requested
      states:
        - {name: Requested, summary: "Admitted; its bundle is being written."}
        - {name: Refused, summary: "Its translator or its target refused it; nothing runs."}
        - {name: Bundled, summary: "Its bundle is written and handed to a translator."}
        - {name: Translated, summary: "Its target's architecture is written, every object covered."}
        - {name: Realizing, summary: "Its target starts its units."}
        - {name: Running, summary: "Every unit runs as desired."}
        - {name: Degraded, summary: "A unit runs below its desired replicas or keeps failing."}
        - {name: Stopped, summary: "Taken down by its deployer."}
        - {name: Failed, summary: "Its target gave up on it."}
      terminal: [Refused, Stopped, Failed]
      transitions:
        - {name: bundle, from: [Requested], to: Bundled}
        - {name: translate, from: [Bundled], to: Translated}
        - {name: refuse_coverage, from: [Bundled], to: Refused}
        - {name: refuse_on_target, from: [Translated, Realizing], to: Refused}
        - {name: realize, from: [Translated], to: Realizing}
        - {name: run, from: [Realizing, Degraded], to: Running}
        - {name: degrade, from: [Running], to: Degraded}
        - {name: fail, from: [Realizing, Running, Degraded], to: Failed}
        - {name: stop, from: [Requested, Bundled, Translated, Realizing, Running, Degraded], to: Stopped}

  - name: agentic.deployment.DeploymentUnit
    naming:
      summary: One unit of a deployment, as its bundle names it and its target observes it.
    identity:
      name: unit_id
      type: agentic.shared.DeploymentUnitId
    fields:
      - {name: deployment_id, type: agentic.shared.DeploymentId}
      - {name: name, type: agentic.shared.Name}
      - {name: kind, type: agentic.deployment.UnitKind}
      - name: parts
        type: List<agentic.shared.Name>
        summary: The part instances of the unit, by path.
      - name: replicas
        type: Optional<Integer>
        summary: The desired copies; absent for a job or scheduled unit, which runs on demand.
      - name: workload_id
        type: Optional<agentic.shared.WorkloadId>
        summary: The workload the unit runs as, once mapped.
      - name: target_object
        type: Optional<String>
        summary: The object of the target's architecture the translator mapped the unit to, by value.
      - {name: ready, type: Integer}
      - {name: last_failure, type: Optional<String>}
    relations:
      - {name: workload, kind: references, target: agentic.runtime.Workload, cardinality: one, via: workload_id}
    invariants:
      - ready >= 0
    lifecycle:
      initial: Declared
      states:
        - {name: Declared, summary: "Named by the bundle."}
        - {name: Mapped, summary: "Mapped to an object of the target's architecture."}
      terminal: [Mapped]
      transitions:
        - {name: map, from: [Declared], to: Mapped}
        - {name: observe, from: [Mapped], to: Mapped}

actors:
  - name: agentic.deployment.Deployer
    naming:
      display: Deployer
      summary: >-
        Who installs architecture revisions on a runtime, drains them and rolls them back; and, on
        the deploy side, agenticspec, which admits a revision, writes its bundle, records its
        units and stops a deployment.
    may:
      - agentic.deployment.InstallRevision
      - agentic.deployment.DrainInstallation
      - agentic.deployment.RollBack
      - agentic.deployment.Installations
      - agentic.deployment.InstallationsOfRuntime
      - agentic.deployment.RequestDeployment
      - agentic.deployment.RecordBundle
      - agentic.deployment.RecordUnit
      - agentic.deployment.StopDeployment
      - agentic.deployment.Deployments
      - agentic.deployment.Units

  - name: agentic.deployment.Runner
    naming:
      display: Runner
      summary: The runtime running an installation, which queues, starts and reports its runs.
    may:
      - agentic.deployment.QueueRun
      - agentic.deployment.StartRun
      - agentic.deployment.WaitRun
      - agentic.deployment.ResumeRun
      - agentic.deployment.FinishRun
      - agentic.deployment.FailRun
      - agentic.deployment.CancelRun
      - agentic.deployment.ReportDrained
      - agentic.deployment.ArchitectureRuns
      - agentic.deployment.RunsOfInstallation
      - agentic.deployment.RunsOfSubject

  - name: agentic.deployment.Requester
    naming:
      display: Requester
      summary: A principal who asked for a run and may cancel it.
    may:
      - agentic.deployment.CancelRun
      - agentic.deployment.ArchitectureRuns
      - agentic.deployment.RunsOfSubject

  - name: agentic.deployment.Translator
    naming:
      display: Translator
      summary: What turns a bundle into its target's architecture and reports the coverage of each object.
    may:
      - agentic.deployment.RecordTranslation
      - agentic.deployment.RefuseCoverage
      - agentic.deployment.MapUnit

  - name: agentic.deployment.Target
    naming:
      display: Target
      summary: What realizes the translated architecture and reports how its units run.
    may:
      - agentic.deployment.StartRealizing
      - agentic.deployment.RefuseOnTarget
      - agentic.deployment.ReportDeploymentRunning
      - agentic.deployment.ReportDeploymentDegraded
      - agentic.deployment.ReportDeploymentFailed
      - agentic.deployment.ObserveUnit
      - agentic.deployment.Units

errors:
  - name: agentic.deployment.UnknownRuntime
    summary: No runtime has this identity; nothing was installed.
    fields:
      - {name: runtime_id, type: agentic.shared.RuntimeId}
  - name: agentic.deployment.UnknownRevision
    summary: No architecture revision has this identity; nothing was installed.
    fields:
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
  - name: agentic.deployment.UnknownInstallation
    summary: No installation has this identity; nothing changed.
    fields:
      - {name: installation_id, type: agentic.shared.InstallationId}
  - name: agentic.deployment.ReplacedOnOtherRuntime
    summary: The installation named as replaced is on another runtime; nothing was installed.
    fields:
      - {name: installation_id, type: agentic.shared.InstallationId}
  - name: agentic.deployment.ReplacedRolledBack
    summary: The installation named as replaced was rolled back, so no rollback could return to it; nothing was installed.
    fields:
      - {name: installation_id, type: agentic.shared.InstallationId}
  - name: agentic.deployment.RuntimeHasActiveInstallation
    summary: The runtime already holds an Active installation; drain it before installing another. Nothing was installed.
    fields:
      - {name: runtime_id, type: agentic.shared.RuntimeId}
  - name: agentic.deployment.InstallationStateConflict
    summary: The installation is not in a state this command acts from.
    fields:
      - {name: state, type: agentic.deployment.Installation.State}
  - name: agentic.deployment.RunsNotEnded
    summary: A run of the installation has not ended, so it is not drained yet.
    fields:
      - {name: installation_id, type: agentic.shared.InstallationId}
  - name: agentic.deployment.NothingToRollBackTo
    summary: The installation replaced none, so there is no revision to roll back to; nothing changed.
    fields:
      - {name: installation_id, type: agentic.shared.InstallationId}
  - name: agentic.deployment.RunKeyUsed
    summary: >-
      A run with this identity exists: the request repeats one already taken, and starts nothing.
      The run it names is the first request's result, read in the views.
    fields:
      - {name: run_id, type: agentic.shared.ArchitectureRunId}
  - name: agentic.deployment.UnknownTask
    summary: No task has this identity; no run was queued.
    fields:
      - {name: task_id, type: agentic.shared.TaskId}
  - name: agentic.deployment.InstallationDraining
    summary: The installation drains and takes no new run; queue it on the installation that replaced it.
    fields:
      - {name: installation_id, type: agentic.shared.InstallationId}
  - name: agentic.deployment.InstallationNotActive
    summary: The installation is drained or rolled back and takes no run.
    fields:
      - {name: installation_id, type: agentic.shared.InstallationId}
  - name: agentic.deployment.UnknownRun
    summary: No architecture run has this identity; nothing changed.
    fields:
      - {name: run_id, type: agentic.shared.ArchitectureRunId}
  - name: agentic.deployment.RunStateConflict
    summary: The run is not in a state this command acts from.
    fields:
      - {name: state, type: agentic.deployment.ArchitectureRun.State}

  - name: agentic.deployment.NotReleased
    summary: The revision is not released, and only the in-process runtime runs a draft.

  - name: agentic.deployment.NotAdmitted
    summary: Admission named findings; each is listed by the name of its rule.
    fields:
      - {name: findings, type: List<agentic.deployment.Finding>}

  - name: agentic.deployment.ScopeTaken
    summary: Another deployment that has not ended holds this scope of the target.
    fields:
      - {name: target, type: agentic.shared.Name}
      - {name: scope, type: agentic.shared.Name}

  - name: agentic.deployment.UnknownDeployment
    summary: No deployment has this identity.
    fields:
      - {name: deployment_id, type: agentic.shared.DeploymentId}

  - name: agentic.deployment.UnknownUnit
    summary: No unit has this identity.
    fields:
      - {name: unit_id, type: agentic.shared.DeploymentUnitId}

  - name: agentic.deployment.NotBundled
    summary: Units are recorded only for a deployment whose bundle is written.

  - name: agentic.deployment.NoFindings
    summary: A refusal names at least one finding.

  - name: agentic.deployment.DeploymentStateConflict
    summary: The deployment is not in a state this command acts from.
    fields:
      - {name: state, type: agentic.deployment.Deployment.State}

  - name: agentic.deployment.UnitStateConflict
    summary: The unit is not in a state this command acts from.
    fields:
      - {name: state, type: agentic.deployment.DeploymentUnit.State}

  - name: agentic.deployment.NegativeReady
    summary: A unit has no negative number of ready replicas; nothing was observed.
    fields:
      - {name: unit_id, type: agentic.shared.DeploymentUnitId}
      - {name: ready, type: Integer}

commands:
  # One Active installation per runtime: a second is refused until the first drains. A new
  # installation that replaces a drained or draining one names it, so a rollback can return to it.
  - name: agentic.deployment.InstallRevision
    naming:
      wire: install-revision
      display: Install an architecture revision on a runtime
    input:
      - {name: runtime_id, type: agentic.shared.RuntimeId}
      - {name: revision_id, type: agentic.shared.ArchitectureRevisionId}
      - {name: binding, type: agentic.deployment.BindingDigest}
      - {name: replaces, type: Optional<agentic.shared.InstallationId>}
    outcomes:
      - name: unknown-runtime
        when_related: {via: input.runtime_id, exists: false}
        error: agentic.deployment.UnknownRuntime
        payload:
          agentic.deployment.UnknownRuntime: {runtime_id: input.runtime_id}
      - name: unknown-revision
        when_related: {via: input.revision_id, exists: false}
        error: agentic.deployment.UnknownRevision
        payload:
          agentic.deployment.UnknownRevision: {revision_id: input.revision_id}
      - name: unknown-replaced
        when_related: {via: input.replaces, exists: false}
        error: agentic.deployment.UnknownInstallation
        payload:
          agentic.deployment.UnknownInstallation: {installation_id: input.replaces}
      - name: replaced-on-other-runtime
        when_related: {via: input.replaces, predicate: runtime_id != input.runtime_id}
        error: agentic.deployment.ReplacedOnOtherRuntime
        payload:
          agentic.deployment.ReplacedOnOtherRuntime: {installation_id: input.replaces}
      - name: replaced-rolled-back
        when_related: {via: input.replaces, predicate: state == RolledBack}
        error: agentic.deployment.ReplacedRolledBack
        payload:
          agentic.deployment.ReplacedRolledBack: {installation_id: input.replaces}
      - name: runtime-has-active
        when_related:
          entity: agentic.deployment.Installation
          where:
            all:
              - runtime_id == input.runtime_id
              - state == Active
          exists: true
        error: agentic.deployment.RuntimeHasActiveInstallation
        payload:
          agentic.deployment.RuntimeHasActiveInstallation: {runtime_id: input.runtime_id}
      - name: installed
        creates: agentic.deployment.Installation
        instance: installation_id
        sets:
          runtime_id: input.runtime_id
          revision_id: input.revision_id
          binding: input.binding
          replaces: input.replaces
          installed_at: {generated: true}
        emits: [agentic.deployment.RevisionInstalled]
        payload:
          agentic.deployment.RevisionInstalled:
            installation_id: {generated: true}
            runtime_id: input.runtime_id
            revision_id: input.revision_id
            binding: input.binding
            replaces: input.replaces

  - name: agentic.deployment.DrainInstallation
    naming:
      wire: drain-installation
      display: Drain an installation
      summary: The installation takes no new run; the runs it holds go on until they end.
    input:
      - {name: installation_id, type: agentic.shared.InstallationId}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownInstallation
        payload:
          agentic.deployment.UnknownInstallation: {installation_id: input.installation_id}
      - name: draining
        moves: agentic.deployment.Installation.drain
        instance: installation_id
        emits: [agentic.deployment.DrainStarted]
        payload:
          agentic.deployment.DrainStarted: {installation_id: input.installation_id}
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.InstallationStateConflict
        payload:
          agentic.deployment.InstallationStateConflict: {state: {subject: state}}

  - name: agentic.deployment.ReportDrained
    naming:
      wire: report-drained
      display: Report an installation drained
    input:
      - {name: installation_id, type: agentic.shared.InstallationId}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownInstallation
        payload:
          agentic.deployment.UnknownInstallation: {installation_id: input.installation_id}
      - name: runs-not-ended
        when_related:
          entity: agentic.deployment.ArchitectureRun
          where:
            all:
              - installation_id == input.installation_id
              - any: [state == Queued, state == Running, state == Waiting]
          exists: true
        error: agentic.deployment.RunsNotEnded
        payload:
          agentic.deployment.RunsNotEnded: {installation_id: input.installation_id}
      - name: drained
        moves: agentic.deployment.Installation.finish_drain
        instance: installation_id
        emits: [agentic.deployment.InstallationDrained]
        payload:
          agentic.deployment.InstallationDrained: {installation_id: input.installation_id}
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.InstallationStateConflict
        payload:
          agentic.deployment.InstallationStateConflict: {state: {subject: state}}

  # The current installation ends and the one it replaced takes runs again, whether it still drains
  # or has drained. Runs of the rolled-back installation keep their revision; the runner cancels or
  # finishes them (CancelReason RolledBack).
  - name: agentic.deployment.RollBack
    naming:
      wire: roll-back
      display: Roll an installation back to the one it replaced
    input:
      - {name: installation_id, type: agentic.shared.InstallationId}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownInstallation
        payload:
          agentic.deployment.UnknownInstallation: {installation_id: input.installation_id}
      - name: nothing-to-roll-back-to
        when_subject:
          predicate: {all: [state == Active, not defined(replaces)]}
        error: agentic.deployment.NothingToRollBackTo
        payload:
          agentic.deployment.NothingToRollBackTo: {installation_id: input.installation_id}
      - name: rolled-back
        moves: agentic.deployment.Installation.roll_back
        instance: installation_id
        affects:
          - entity: agentic.deployment.Installation
            where: installation_id == subject.replaces
            moves: agentic.deployment.Installation.reactivate
        emits: [agentic.deployment.InstallationRolledBack]
        payload:
          agentic.deployment.InstallationRolledBack:
            installation_id: input.installation_id
            reactivated: {subject: replaces}
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.InstallationStateConflict
        payload:
          agentic.deployment.InstallationStateConflict: {state: {subject: state}}

  # The caller names the run's identity, once per intent: it is the idempotency key. A repeat with
  # the same identity is refused before anything else is read and starts nothing; its error names
  # the run the first request queued (M32).
  # UNMAPPED: a repeat returns the first result as a refusal that names the run, not as the first
  # response replayed: `replays:` validates, and the interpreted target answers it ESS-CF-TARGET
  # ("the retained result ... is not interpreted yet").
  - name: agentic.deployment.QueueRun
    naming:
      wire: queue-architecture-run
      display: Queue a run of an installation
      summary: >-
        The installation takes a run for a subject, pinned to its revision and binding. A draining,
        drained or rolled-back installation takes none.
    input:
      - name: run_id
        type: agentic.shared.ArchitectureRunId
        summary: Chosen by the caller once per intent; a repeat with the same identity starts nothing.
      - {name: installation_id, type: agentic.shared.InstallationId}
      - {name: subject_key, type: Optional<String>}
      - {name: task_id, type: Optional<agentic.shared.TaskId>}
    outcomes:
      - name: repeated
        existing_instance: true
        error: agentic.deployment.RunKeyUsed
        payload:
          agentic.deployment.RunKeyUsed: {run_id: input.run_id}
      - name: unknown-installation
        when_related: {via: input.installation_id, exists: false}
        error: agentic.deployment.UnknownInstallation
        payload:
          agentic.deployment.UnknownInstallation: {installation_id: input.installation_id}
      - name: unknown-task
        when_related: {via: input.task_id, exists: false}
        error: agentic.deployment.UnknownTask
        payload:
          agentic.deployment.UnknownTask: {task_id: input.task_id}
      - name: installation-draining
        when_related: {via: input.installation_id, predicate: state == Draining}
        error: agentic.deployment.InstallationDraining
        payload:
          agentic.deployment.InstallationDraining: {installation_id: input.installation_id}
      - name: installation-not-active
        when_related: {via: input.installation_id, predicate: {any: [state == Drained, state == RolledBack]}}
        error: agentic.deployment.InstallationNotActive
        payload:
          agentic.deployment.InstallationNotActive: {installation_id: input.installation_id}
      - name: queued
        creates: agentic.deployment.ArchitectureRun
        instance: run_id
        sets:
          installation_id: input.installation_id
          revision_id: {related: {via: input.installation_id, field: revision_id}}
          binding: {related: {via: input.installation_id, field: binding}}
          subject_key: input.subject_key
          task_id: input.task_id
          queued_at: {generated: true}
        emits: [agentic.deployment.RunQueued]
        payload:
          agentic.deployment.RunQueued:
            run_id: input.run_id
            installation_id: input.installation_id
            revision_id: {related: {via: input.installation_id, field: revision_id}}
            binding: {related: {via: input.installation_id, field: binding}}
            subject_key: input.subject_key
            task_id: input.task_id

  # A queued run starts while its installation is Active or Draining: draining takes no new run
  # and lets the ones it took go on. A rolled-back installation starts none.
  - name: agentic.deployment.StartRun
    naming:
      wire: start-architecture-run
      display: Start a queued run
    input:
      - {name: run_id, type: agentic.shared.ArchitectureRunId}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownRun
        payload:
          agentic.deployment.UnknownRun: {run_id: input.run_id}
      - name: installation-not-active
        when_related: {via: installation_id, predicate: {any: [state == Drained, state == RolledBack]}}
        error: agentic.deployment.InstallationNotActive
        payload:
          agentic.deployment.InstallationNotActive: {installation_id: {subject: installation_id}}
      - name: started
        moves: agentic.deployment.ArchitectureRun.start
        instance: run_id
        emits: [agentic.deployment.RunStarted]
        payload:
          agentic.deployment.RunStarted: {run_id: input.run_id}
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.RunStateConflict
        payload:
          agentic.deployment.RunStateConflict: {state: {subject: state}}

  - name: agentic.deployment.WaitRun
    naming:
      wire: wait-architecture-run
      display: Record that a run waits
    input:
      - {name: run_id, type: agentic.shared.ArchitectureRunId}
      - {name: reason, type: agentic.deployment.WaitReason}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownRun
        payload:
          agentic.deployment.UnknownRun: {run_id: input.run_id}
      - name: waiting
        moves: agentic.deployment.ArchitectureRun.wait
        instance: run_id
        emits: [agentic.deployment.RunWaiting]
        payload:
          agentic.deployment.RunWaiting: {run_id: input.run_id, reason: input.reason}
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.RunStateConflict
        payload:
          agentic.deployment.RunStateConflict: {state: {subject: state}}

  - name: agentic.deployment.ResumeRun
    naming:
      wire: resume-architecture-run
      display: Resume a waiting run
    input:
      - {name: run_id, type: agentic.shared.ArchitectureRunId}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownRun
        payload:
          agentic.deployment.UnknownRun: {run_id: input.run_id}
      - name: resumed
        moves: agentic.deployment.ArchitectureRun.resume
        instance: run_id
        emits: [agentic.deployment.RunResumed]
        payload:
          agentic.deployment.RunResumed: {run_id: input.run_id}
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.RunStateConflict
        payload:
          agentic.deployment.RunStateConflict: {state: {subject: state}}

  - name: agentic.deployment.FinishRun
    naming:
      wire: finish-architecture-run
      display: Report a run done
    input:
      - {name: run_id, type: agentic.shared.ArchitectureRunId}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownRun
        payload:
          agentic.deployment.UnknownRun: {run_id: input.run_id}
      - name: done
        moves: agentic.deployment.ArchitectureRun.finish
        instance: run_id
        emits: [agentic.deployment.RunDone]
        payload:
          agentic.deployment.RunDone: {run_id: input.run_id}
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.RunStateConflict
        payload:
          agentic.deployment.RunStateConflict: {state: {subject: state}}

  - name: agentic.deployment.FailRun
    naming:
      wire: fail-architecture-run
      display: Report a run failed
    input:
      - {name: run_id, type: agentic.shared.ArchitectureRunId}
      - {name: failure, type: String}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownRun
        payload:
          agentic.deployment.UnknownRun: {run_id: input.run_id}
      - name: failed
        moves: agentic.deployment.ArchitectureRun.fail
        instance: run_id
        sets:
          failure: input.failure
        emits: [agentic.deployment.RunFailed]
        payload:
          agentic.deployment.RunFailed: {run_id: input.run_id, failure: input.failure}
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.RunStateConflict
        payload:
          agentic.deployment.RunStateConflict: {state: {subject: state}}

  - name: agentic.deployment.CancelRun
    naming:
      wire: cancel-architecture-run
      display: Cancel a run
    input:
      - {name: run_id, type: agentic.shared.ArchitectureRunId}
      - {name: reason, type: agentic.deployment.CancelReason}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownRun
        payload:
          agentic.deployment.UnknownRun: {run_id: input.run_id}
      - name: cancelled
        moves: agentic.deployment.ArchitectureRun.cancel
        instance: run_id
        sets:
          cancelled_for: input.reason
        emits: [agentic.deployment.RunCancelled]
        payload:
          agentic.deployment.RunCancelled: {run_id: input.run_id, reason: input.reason}
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.RunStateConflict
        payload:
          agentic.deployment.RunStateConflict: {state: {subject: state}}

  - name: agentic.deployment.RequestDeployment
    naming:
      wire: request-deployment
      display: Request a deployment
      summary: Record an admitted revision for one scope of one target, or refuse it with the findings of admission.
    input:
      - {name: architecture_id, type: agentic.shared.ArchitectureId}
      - {name: revision_id, type: Optional<agentic.shared.ArchitectureRevisionId>}
      - {name: in_process, type: Boolean}
      - {name: target, type: agentic.shared.Name}
      - {name: scope, type: agentic.shared.Name}
      - {name: contract_digest, type: agentic.architecture.Digest}
      - {name: binding_digest, type: agentic.architecture.Digest}
      - {name: packing_digest, type: agentic.architecture.Digest}
      - {name: findings, type: List<agentic.deployment.Finding>}
      - {name: promoted_from, type: Optional<agentic.shared.DeploymentId>}
    outcomes:
      - name: not-admitted
        when: findings.count > 0
        error: agentic.deployment.NotAdmitted
        payload:
          agentic.deployment.NotAdmitted: {findings: input.findings}
      # Released is "names the revision admission read": the in-process runtime alone runs a
      # draft, which has none.
      - name: not-released
        when: {all: [in_process == false, missing(revision_id)]}
        error: agentic.deployment.NotReleased
      - name: scope-taken
        when_related:
          entity: agentic.deployment.Deployment
          where:
            all:
              - target == input.target
              - scope == input.scope
              - {not: {state: [Refused, Stopped, Failed]}}
          exists: true
        error: agentic.deployment.ScopeTaken
        payload:
          agentic.deployment.ScopeTaken: {target: input.target, scope: input.scope}
      - name: requested
        creates: agentic.deployment.Deployment
        instance: deployment_id
        sets:
          architecture_id: input.architecture_id
          revision_id: input.revision_id
          in_process: input.in_process
          target: input.target
          scope: input.scope
          contract_digest: input.contract_digest
          binding_digest: input.binding_digest
          packing_digest: input.packing_digest
          promoted_from: input.promoted_from
          findings: input.findings
        emits: [agentic.deployment.DeploymentRequested]
        payload:
          agentic.deployment.DeploymentRequested:
            deployment_id: {generated: true}
            architecture_id: input.architecture_id
            revision_id: input.revision_id
            target: input.target
            scope: input.scope

  - name: agentic.deployment.RecordBundle
    naming:
      wire: record-bundle
      display: Record the bundle
    input:
      - {name: deployment_id, type: agentic.shared.DeploymentId}
      - {name: bundle_digest, type: agentic.architecture.Digest}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownDeployment
        payload:
          agentic.deployment.UnknownDeployment: {deployment_id: input.deployment_id}
      - name: bundled
        moves: agentic.deployment.Deployment.bundle
        instance: deployment_id
        sets:
          bundle_digest: input.bundle_digest
        emits: [agentic.deployment.DeploymentBundled]
        payload:
          agentic.deployment.DeploymentBundled:
            deployment_id: input.deployment_id
            bundle_digest: input.bundle_digest
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.DeploymentStateConflict
        payload:
          agentic.deployment.DeploymentStateConflict: {state: {subject: state}}

  - name: agentic.deployment.RecordUnit
    naming:
      wire: record-unit
      display: Record a unit
    input:
      - {name: deployment_id, type: agentic.shared.DeploymentId}
      - {name: name, type: agentic.shared.Name}
      - {name: kind, type: agentic.deployment.UnitKind}
      - {name: parts, type: List<agentic.shared.Name>}
      - {name: replicas, type: Optional<Integer>}
    outcomes:
      - name: unknown-deployment
        when_related:
          via: input.deployment_id
          exists: false
        error: agentic.deployment.UnknownDeployment
        payload:
          agentic.deployment.UnknownDeployment: {deployment_id: input.deployment_id}
      - name: not-bundled
        when_related:
          via: input.deployment_id
          predicate: state != Bundled
        error: agentic.deployment.NotBundled
      - name: recorded
        creates: agentic.deployment.DeploymentUnit
        instance: unit_id
        sets:
          deployment_id: input.deployment_id
          name: input.name
          kind: input.kind
          parts: input.parts
          replicas: input.replicas
          ready: 0
        emits: [agentic.deployment.UnitRecorded]
        payload:
          agentic.deployment.UnitRecorded:
            unit_id: {generated: true}
            deployment_id: input.deployment_id
            name: input.name
            kind: input.kind

  - name: agentic.deployment.RecordTranslation
    naming:
      wire: record-translation
      display: Record the translation
    input:
      - {name: deployment_id, type: agentic.shared.DeploymentId}
      - {name: translation_digest, type: agentic.architecture.Digest}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownDeployment
        payload:
          agentic.deployment.UnknownDeployment: {deployment_id: input.deployment_id}
      - name: translated
        moves: agentic.deployment.Deployment.translate
        instance: deployment_id
        sets:
          translation_digest: input.translation_digest
        emits: [agentic.deployment.DeploymentTranslated]
        payload:
          agentic.deployment.DeploymentTranslated:
            deployment_id: input.deployment_id
            translation_digest: input.translation_digest
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.DeploymentStateConflict
        payload:
          agentic.deployment.DeploymentStateConflict: {state: {subject: state}}

  - name: agentic.deployment.RefuseCoverage
    naming:
      wire: refuse-coverage
      display: Refuse on coverage
      summary: The translator refused objects of the bundle; the deployment is refused as CoverageRefused.
    input:
      - {name: deployment_id, type: agentic.shared.DeploymentId}
      - {name: findings, type: List<agentic.deployment.Finding>}
    outcomes:
      - name: no-findings
        when: findings.count == 0
        error: agentic.deployment.NoFindings
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownDeployment
        payload:
          agentic.deployment.UnknownDeployment: {deployment_id: input.deployment_id}
      - name: refused
        moves: agentic.deployment.Deployment.refuse_coverage
        instance: deployment_id
        sets:
          refusal: CoverageRefused
          findings: input.findings
        emits: [agentic.deployment.DeploymentRefused]
        payload:
          agentic.deployment.DeploymentRefused:
            deployment_id: input.deployment_id
            refusal: CoverageRefused
            findings: input.findings
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.DeploymentStateConflict
        payload:
          agentic.deployment.DeploymentStateConflict: {state: {subject: state}}

  - name: agentic.deployment.MapUnit
    naming:
      wire: map-unit
      display: Map a unit
    input:
      - {name: unit_id, type: agentic.shared.DeploymentUnitId}
      - {name: target_object, type: String}
      - {name: workload_id, type: Optional<agentic.shared.WorkloadId>}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownUnit
        payload:
          agentic.deployment.UnknownUnit: {unit_id: input.unit_id}
      - name: mapped
        moves: agentic.deployment.DeploymentUnit.map
        instance: unit_id
        sets:
          target_object: input.target_object
          workload_id: input.workload_id
        emits: [agentic.deployment.UnitMapped]
        payload:
          agentic.deployment.UnitMapped:
            unit_id: input.unit_id
            target_object: input.target_object
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.UnitStateConflict
        payload:
          agentic.deployment.UnitStateConflict: {state: {subject: state}}

  - name: agentic.deployment.StartRealizing
    naming:
      wire: start-realizing
      display: Start realizing
    input:
      - {name: deployment_id, type: agentic.shared.DeploymentId}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownDeployment
        payload:
          agentic.deployment.UnknownDeployment: {deployment_id: input.deployment_id}
      - name: realizing
        moves: agentic.deployment.Deployment.realize
        instance: deployment_id
        emits: [agentic.deployment.RealizingStarted]
        payload:
          agentic.deployment.RealizingStarted: {deployment_id: input.deployment_id}
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.DeploymentStateConflict
        payload:
          agentic.deployment.DeploymentStateConflict: {state: {subject: state}}

  - name: agentic.deployment.RefuseOnTarget
    naming:
      wire: refuse-on-target
      display: Refuse on the target
      summary: The target named violations (quota, placement, policy); the deployment is refused as TargetRefused.
    input:
      - {name: deployment_id, type: agentic.shared.DeploymentId}
      - {name: findings, type: List<agentic.deployment.Finding>}
    outcomes:
      - name: no-findings
        when: findings.count == 0
        error: agentic.deployment.NoFindings
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownDeployment
        payload:
          agentic.deployment.UnknownDeployment: {deployment_id: input.deployment_id}
      - name: refused
        moves: agentic.deployment.Deployment.refuse_on_target
        instance: deployment_id
        sets:
          refusal: TargetRefused
          findings: input.findings
        emits: [agentic.deployment.DeploymentRefused]
        payload:
          agentic.deployment.DeploymentRefused:
            deployment_id: input.deployment_id
            refusal: TargetRefused
            findings: input.findings
      - name: wrong-state
        wrong_state: true
        error: agentic.deployment.DeploymentStateConflict
        payload:
          agentic.deployment.DeploymentStateConflict: {state: {subject: state}}

  - name: agentic.deployment.ReportDeploymentRunning
    naming:
      wire: report-deployment-running
      display: Report the deployment running
    input:
      - {name: deployment_id, type: agentic.shared.DeploymentId}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownDeployment
        payload:
          agentic.deployment.UnknownDeployment: {deployment_id: input.deployment_id}
      - name: running
        moves: agentic.deployment.Deployment.run
        instance: deployment_id
        emits: [agentic.deployment.DeploymentRunning]
        payload:
          agentic.deployment.DeploymentRunning: {deployment_id: input.deployment_id}

  - name: agentic.deployment.ReportDeploymentDegraded
    naming:
      wire: report-deployment-degraded
      display: Report the deployment degraded
    input:
      - {name: deployment_id, type: agentic.shared.DeploymentId}
      - {name: reason, type: String}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownDeployment
        payload:
          agentic.deployment.UnknownDeployment: {deployment_id: input.deployment_id}
      - name: degraded
        moves: agentic.deployment.Deployment.degrade
        instance: deployment_id
        sets:
          reason: input.reason
        emits: [agentic.deployment.DeploymentDegraded]
        payload:
          agentic.deployment.DeploymentDegraded:
            deployment_id: input.deployment_id
            reason: input.reason

  - name: agentic.deployment.ReportDeploymentFailed
    naming:
      wire: report-deployment-failed
      display: Report the deployment failed
    input:
      - {name: deployment_id, type: agentic.shared.DeploymentId}
      - {name: reason, type: String}
    outcomes:
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownDeployment
        payload:
          agentic.deployment.UnknownDeployment: {deployment_id: input.deployment_id}
      - name: failed
        moves: agentic.deployment.Deployment.fail
        instance: deployment_id
        sets:
          reason: input.reason
        emits: [agentic.deployment.DeploymentFailed]
        payload:
          agentic.deployment.DeploymentFailed:
            deployment_id: input.deployment_id
            reason: input.reason

  - name: agentic.deployment.ObserveUnit
    naming:
      wire: observe-unit
      display: Observe a unit
      summary: What the target last observed of a mapped unit, its ready replicas and its last failure.
    input:
      - {name: unit_id, type: agentic.shared.DeploymentUnitId}
      - {name: ready, type: Integer}
      - {name: last_failure, type: Optional<String>}
    outcomes:
      - name: negative-ready
        when: ready < 0
        error: agentic.deployment.NegativeReady
        payload:
          agentic.deployment.NegativeReady: {unit_id: input.unit_id, ready: input.ready}
        summary: The unit keeps the ready count it last held (its invariant is ready >= 0).
      - name: unknown
        unknown_instance: true
        error: agentic.deployment.UnknownUnit
        payload:
          agentic.deployment.UnknownUnit: {unit_id: input.unit_id}
      - name: observed
        moves: agentic.deployment.DeploymentUnit.observe
        instance: unit_id
        sets:
          ready: input.ready
          last_failure: input.last_failure
        emits: [agentic.deployment.UnitObserved]
        payload:
          agentic.deployment.UnitObserved:
            unit_id: input.unit_id
            ready: input.ready
            last_failure: input.last_failure
      - name: not-mapped
        wrong_state: true
        error: agentic.deployment.UnitStateConflict
        payload:
          agentic.deployment.UnitStateConflict: {state: {subject: state}}

  - name: agentic.deployment.StopDeployment
    naming:
      wire: stop-deployment
      display: Stop a deployment
    input:
      - {name: deployment_id, type: agentic.shared.DeploymentId}
    outcomes:
