format: ess/37
system: agentic
version: v1

summary: >-
  The building blocks of agentic development: principals, models, gateways, tools, agents,
  harnesses, work, authority, channels, questions, workspaces, sandboxes, runtimes, shared
  resources, and the architecture that composes them. Each block is a contract; a runtime that
  implements one proves it against the block's commands, events and views.

