      - {name: channel_id, type: agentic.shared.ChannelId}
      - {name: from, type: agentic.channel.PartyId}
      - {name: act, type: agentic.channel.Act}
      - {name: entry, type: Optional<agentic.channel.EntryKind>}
      - {name: content, type: agentic.shared.Content}
      - {name: in_reply_to, type: Optional<agentic.shared.PostId>}
      - {name: delegation_id, type: Optional<agentic.shared.DelegationId>}
      - {name: proof, type: Optional<agentic.channel.Proof>}

  - name: agentic.channel.PostTaken
    fields:
      - {name: post_id, type: agentic.shared.PostId}
      - {name: reader, type: agentic.channel.PartyId}

views:
  - name: agentic.channel.Channels
    source: agentic.channel.Channel
