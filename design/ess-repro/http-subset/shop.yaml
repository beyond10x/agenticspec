# One component reached by network serves two commands and two views. An audience of an
# architecture may use a subset of a component's surface (an ingress's interface: here
# `RetireItem` and `Items`), and agenticspec publishes an `ess-http/1` protocol binding and an
# OpenAPI document of exactly that subset. `binding.yaml` is the protocol binding, its paths left
# open for each server:
#
#   ess specify http validate --path design/ess-repro/http-subset --binding design/ess-repro/http-subset/binding.yaml
#
# answers `2 route(s), 2 open, valid`. Its OpenAPI document cannot be projected:
#
#   ess generate --path design/ess-repro/http-subset --kind openapi --http design/ess-repro/http-subset/binding.yaml --out <dir>
#
# answers `binding.yaml cannot be projected to OpenAPI: ... has an open route: the binding leaves
# its path to each server, and a published document needs one`. With every path filled in, the
# document still holds `ListItem` and `ItemById` at their derived routes: an operation a binding
# does not name keeps its derived route, so a binding cannot select a subset of a component's
# surface. `agenticspec ingress project` therefore narrows the OpenAPI document of the whole
# component (`ess generate --kind openapi`, no binding) to the interface's operations and the
# schemas they reference.
domain: repro.shop

types:
  - {name: repro.shop.ItemId, kind: newtype, of: String}

entities:
  - name: repro.shop.Item
    identity: {name: item_id, type: repro.shop.ItemId}
    fields:
      - {name: price, type: Integer}
    lifecycle:
      initial: Listed
      states: [Listed, Retired]
      terminal: [Retired]
      transitions:
        - {name: retire, from: [Listed], to: Retired}

commands:
  - name: repro.shop.ListItem
    input:
      - {name: item_id, type: repro.shop.ItemId}
      - {name: price, type: Integer}
    outcomes:
      - name: listed
        creates: repro.shop.Item
        instance: item_id
        sets: {price: input.price}
        emits: [repro.shop.ItemListed]
        payload:
          repro.shop.ItemListed: {item_id: input.item_id}
  - name: repro.shop.RetireItem
    input:
      - {name: item_id, type: repro.shop.ItemId}
    outcomes:
      - name: retired
        moves: repro.shop.Item.retire
        instance: item_id
        emits: [repro.shop.ItemRetired]
        payload:
          repro.shop.ItemRetired: {item_id: input.item_id}

events:
  - name: repro.shop.ItemListed
    fields:
      - {name: item_id, type: repro.shop.ItemId}
  - name: repro.shop.ItemRetired
    fields:
      - {name: item_id, type: repro.shop.ItemId}

views:
  - name: repro.shop.Items
    source: repro.shop.Item
    fields:
      - {name: item_id, type: repro.shop.ItemId}
      - {name: price, type: Integer}
  - name: repro.shop.ItemById
    source: repro.shop.Item
    params:
      - {name: item_id, type: repro.shop.ItemId}
    filter: item_id == param.item_id
    fields:
      - {name: item_id, type: repro.shop.ItemId}

actors:
  - name: repro.shop.Clerk
    may: [repro.shop.ListItem, repro.shop.RetireItem]

components:
  - component: shop
    reached_by: network
    owns: {domains: [repro.shop]}
    accepts: {commands: [repro.shop.ListItem, repro.shop.RetireItem]}
    publishes: {events: [repro.shop.ItemListed, repro.shop.ItemRetired]}
