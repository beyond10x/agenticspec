format: ess/37
system: agentic
version: v1

summary: >-
  The building blocks of agentic development with their packs. The core blocks of blocks/ are
  read unchanged; each pack under packs/ adds the domains of one group of concepts that more than
  one field of work reuses (source control, tracking, files, a shell), named without any product.
  A pack depends on the core and on the packs it declares; the core depends on no pack.

