domain: agentic.files.toolset

summary: >-
  The file tools an agent calls, as conceptual tools a harness binds its own tools to: read_file,
  write_file, edit_file, list_dir, search, move, copy and delete. Each tool is one command, typed by
  its input, its answer and its effect: which file it reads, creates, changes or removes. A file
  lives in a workspace (`agentic.workspace`). Every tool that writes names a live lease of that
  workspace and is refused without one; reading needs none. An edit names the content it expects,
  so an edit over a file that changed since it was read is refused. Which concrete tool of which
  harness plays a conceptual tool is a binding, not this block.

naming:
  wire: files
  display: File tools

types:
  - {name: agentic.files.toolset.FileId, kind: newtype, of: Uuid}

  - name: agentic.files.toolset.EntryKind
    kind: enum
    variants: [File, Directory]

  - name: agentic.files.toolset.DirectoryEntry
    kind: struct
    fields:
      - {name: path, type: agentic.workspace.Path}
      - {name: kind, type: agentic.files.toolset.EntryKind}

  - name: agentic.files.toolset.SearchMatch
    kind: struct
    fields:
      - {name: path, type: agentic.workspace.Path}
      # UNMAPPED: a match line counts from 1; ESS 0.99.2 observes no invariant of a struct in a
      # response, so the rule stays prose until an engine of the search tool states it.
      - {name: line, type: Integer}
      - name: excerpt
        type: String
        summary: The text of the matching line.

  - name: agentic.files.toolset.RangeEdit
    kind: struct
    naming:
      summary: Replace the lines from `first_line` to `last_line`, both included, counted from 1.
    fields:
      - {name: first_line, type: Integer}
      - {name: last_line, type: Integer}
      - {name: replacement, type: agentic.shared.Content}
    invariants:
      - first_line >= 1
      - last_line >= first_line

  - name: agentic.files.toolset.AnchoredEdit
    kind: struct
    naming:
      summary: >-
        Replace the text `anchor`, which must occur exactly once in the file, with `replacement`.
    fields:
      - {name: anchor, type: agentic.shared.Content}
      - {name: replacement, type: agentic.shared.Content}

  - name: agentic.files.toolset.Edit
    kind: union
    tag: by
    variants:
      Range: agentic.files.toolset.RangeEdit
      Anchor: agentic.files.toolset.AnchoredEdit
      Whole: agentic.shared.Content

entities:
  - name: agentic.files.toolset.File
    naming:
      summary: One file in one workspace, with the digest of its content.
    identity:
      name: file_id
      type: agentic.files.toolset.FileId
    fields:
      - name: workspace_id
        type: agentic.shared.WorkspaceId
      - name: path
        type: agentic.workspace.Path
      - name: content
        type: agentic.shared.Content
      - name: executable
        type: Boolean
      - name: last_lease_id
        type: agentic.shared.LeaseId
        summary: The lease the last write was made under.
    relations:
      - name: workspace
        kind: references
        target: agentic.workspace.Workspace
        cardinality: one
        via: workspace_id
      - name: last_lease
        kind: references
        target: agentic.workspace.Lease
        cardinality: one
        via: last_lease_id
    # UNMAPPED: a path held by one file per workspace is enforced on copy only; write_file
    # addresses a new file by its identity. Whether write_file should look a file up by path is a
    # binding's question. Open question for the owner.
    lifecycle:
      initial: Present
      states: [Present]
      terminal: [Present]

actors:
  - name: agentic.files.toolset.FileTool
    naming:
      display: File tool
      summary: >-
        The harness acting on an agent's tool call. Which agent and which call is the harness's
        record (`agentic.harness` ToolCall); this block sees the effect.
    may:
      - agentic.files.toolset.ReadFile
      - agentic.files.toolset.WriteFile
      - agentic.files.toolset.EditFile
      - agentic.files.toolset.ListDir
      - agentic.files.toolset.Search
      - agentic.files.toolset.MoveFile
      - agentic.files.toolset.CopyFile
      - agentic.files.toolset.DeleteFile
      - agentic.files.toolset.Files

errors:
  - name: agentic.files.toolset.FileNotFound
    summary: No file of this identity exists.
    fields:
      - {name: file_id, type: agentic.files.toolset.FileId}

  - name: agentic.files.toolset.FileExists
    summary: >-
      A file of this identity exists. write_file creates a file; replacing a whole file is edit_file
      with a Whole edit.
    fields:
      - {name: file_id, type: agentic.files.toolset.FileId}

  - name: agentic.files.toolset.UnknownWorkspace
    summary: No workspace of this identity exists.
    fields:
      - {name: workspace_id, type: agentic.shared.WorkspaceId}

  - name: agentic.files.toolset.OtherWorkspace
    summary: The file lives in another workspace than the one named.
    fields:
      - {name: file_id, type: agentic.files.toolset.FileId}
      - {name: workspace_id, type: agentic.shared.WorkspaceId}

  - name: agentic.files.toolset.UnknownLease
    summary: No lease of this identity exists.
    fields:
      - {name: lease_id, type: agentic.shared.LeaseId}

  - name: agentic.files.toolset.LeaseNotLive
    summary: The lease is requested, released or expired; nothing is written under it.
    fields:
      - {name: lease_id, type: agentic.shared.LeaseId}

  - name: agentic.files.toolset.LeaseOfOtherWorkspace
    summary: The lease is a lease of another workspace.
    fields:
      - {name: lease_id, type: agentic.shared.LeaseId}

  - name: agentic.files.toolset.ContentChanged
    summary: >-
      The file's content is no longer the content the edit expected: it changed since it was read.
    fields:
      - {name: file_id, type: agentic.files.toolset.FileId}
      - {name: content, type: agentic.shared.Content}

  - name: agentic.files.toolset.EditDoesNotApply
    summary: >-
      The anchor does not occur exactly once, or the line range lies outside the file. Decided by the
      tool on the file's content, which this block holds only as a digest.
    fields:
      - {name: file_id, type: agentic.files.toolset.FileId}

  - name: agentic.files.toolset.PathTaken
    summary: Another file of the workspace holds this path.
    fields:
      - {name: path, type: agentic.workspace.Path}

commands:
  - name: agentic.files.toolset.ReadFile
    naming:
      wire: read_file
      display: read_file
      summary: "Reads one file. Input: the file. Answer: its path, content and whether it is executable. Effect: none."
    input:
      - {name: file_id, type: agentic.files.toolset.FileId}
    # The answer names the content by the fields of agentic.shared.Content, flat: ESS 0.99.2
    # observes no struct with an invariant in a response, and Content holds `length >= 0`.
    response:
      - {name: path, type: agentic.workspace.Path}
      - {name: digest, type: String}
      - {name: length, type: Integer}
      - {name: class, type: String}
      - {name: executable, type: Boolean}
    outcomes:
      - name: no-such-file
        unknown_instance: true
        error: agentic.files.toolset.FileNotFound
        payload:
          agentic.files.toolset.FileNotFound: {file_id: input.file_id}
      - name: read
        preserves: agentic.files.toolset.File
        instance: file_id
        returns: true

  - name: agentic.files.toolset.WriteFile
    naming:
      wire: write_file
      display: write_file
      summary: "Creates one file. Input: workspace, lease, path, content. Effect: a new File."
    input:
      - {name: file_id, type: agentic.files.toolset.FileId}
      - {name: workspace_id, type: agentic.shared.WorkspaceId}
      - {name: lease_id, type: agentic.shared.LeaseId}
      - {name: path, type: agentic.workspace.Path}
      - {name: content, type: agentic.shared.Content}
      - {name: executable, type: Boolean}
      - {name: at, type: Timestamp}
    outcomes:
      - name: exists
        existing_instance: true
        error: agentic.files.toolset.FileExists
        payload:
          agentic.files.toolset.FileExists: {file_id: input.file_id}
      - name: unknown-workspace
        when_related: {via: input.workspace_id, exists: false}
        error: agentic.files.toolset.UnknownWorkspace
        payload:
          agentic.files.toolset.UnknownWorkspace: {workspace_id: input.workspace_id}
      - name: unknown-lease
        when_related: {via: input.lease_id, exists: false}
        error: agentic.files.toolset.UnknownLease
        payload:
          agentic.files.toolset.UnknownLease: {lease_id: input.lease_id}
      - name: lease-not-live
        when_related: {via: input.lease_id, predicate: state != Live}
        error: agentic.files.toolset.LeaseNotLive
        payload:
          agentic.files.toolset.LeaseNotLive: {lease_id: input.lease_id}
      - name: lease-of-other-workspace
        when_related: {via: input.lease_id, predicate: workspace_id != input.workspace_id}
        error: agentic.files.toolset.LeaseOfOtherWorkspace
        payload:
          agentic.files.toolset.LeaseOfOtherWorkspace: {lease_id: input.lease_id}
      - name: written
        creates: agentic.files.toolset.File
        instance: file_id
        sets:
          workspace_id: input.workspace_id
          path: input.path
          content: input.content
          executable: input.executable
          last_lease_id: input.lease_id
        emits: [agentic.files.toolset.FileWritten]
        payload:
          agentic.files.toolset.FileWritten:
            file_id: input.file_id
            workspace_id: input.workspace_id
            lease_id: input.lease_id
            path: input.path
            content: input.content
            at: input.at

  - name: agentic.files.toolset.EditFile
    naming:
      wire: edit_file
      display: edit_file
      summary: >-
        Changes one file by a line range, by replacing an anchor that occurs once, or as a whole.
        Input: the file, its workspace, a lease, the content it expects and the edit. Answer: the new
        content. Effect: the File's content.
    input:
      - {name: file_id, type: agentic.files.toolset.FileId}
      - {name: workspace_id, type: agentic.shared.WorkspaceId}
      - {name: lease_id, type: agentic.shared.LeaseId}
      - name: expected
        type: String
        summary: The digest of the content the edit was made against.
      - {name: edit, type: agentic.files.toolset.Edit}
      - {name: at, type: Timestamp}
    # The new content by the fields of agentic.shared.Content, flat, as read_file answers it.
    response:
      - {name: digest, type: String}
      - {name: length, type: Integer}
      - {name: class, type: String}
    outcomes:
      - name: no-such-file
        unknown_instance: true
        error: agentic.files.toolset.FileNotFound
        payload:
          agentic.files.toolset.FileNotFound: {file_id: input.file_id}
      - name: other-workspace
        when_subject:
          predicate: workspace_id != input.workspace_id
        error: agentic.files.toolset.OtherWorkspace
        payload:
          agentic.files.toolset.OtherWorkspace:
            file_id: input.file_id
            workspace_id: {subject: workspace_id}
      - name: content-changed
        when_subject:
          predicate: content.digest != input.expected
        error: agentic.files.toolset.ContentChanged
        payload:
          agentic.files.toolset.ContentChanged:
            file_id: input.file_id
            content: {subject: content}
      - name: unknown-lease
        when_related: {via: input.lease_id, exists: false}
        error: agentic.files.toolset.UnknownLease
        payload:
          agentic.files.toolset.UnknownLease: {lease_id: input.lease_id}
      - name: lease-not-live
        when_related: {via: input.lease_id, predicate: state != Live}
        error: agentic.files.toolset.LeaseNotLive
        payload:
          agentic.files.toolset.LeaseNotLive: {lease_id: input.lease_id}
      - name: lease-of-other-workspace
        when_related: {via: input.lease_id, predicate: workspace_id != input.workspace_id}
        error: agentic.files.toolset.LeaseOfOtherWorkspace
        payload:
          agentic.files.toolset.LeaseOfOtherWorkspace: {lease_id: input.lease_id}
      - name: does-not-apply
        external: the anchor does not occur exactly once, or the range lies outside the file
        error: agentic.files.toolset.EditDoesNotApply
        payload:
          agentic.files.toolset.EditDoesNotApply: {file_id: input.file_id}
      - name: edited
        updates: agentic.files.toolset.File
        instance: file_id
        sets:
          content: {generated: true}
          last_lease_id: input.lease_id
        returns: true
        emits: [agentic.files.toolset.FileEdited]
        payload:
          agentic.files.toolset.FileEdited:
            file_id: input.file_id
            lease_id: input.lease_id
            before: {subject: content}
            at: input.at

  - name: agentic.files.toolset.ListDir
    naming:
      wire: list_dir
      display: list_dir
      summary: "Lists one directory of a workspace. Input: workspace, directory. Answer: its entries. Effect: none."
    input:
      - {name: workspace_id, type: agentic.shared.WorkspaceId}
      - {name: directory, type: agentic.workspace.Path}
    response:
      - {name: entries, type: List<agentic.files.toolset.DirectoryEntry>}
    outcomes:
      - name: unknown-workspace
        unknown_instance: true
        error: agentic.files.toolset.UnknownWorkspace
        payload:
          agentic.files.toolset.UnknownWorkspace: {workspace_id: input.workspace_id}
      # UNMAPPED: that the entries are exactly the files of the workspace under `directory` is a
      # rule over the answer and the File rows; ESS 0.99.2 cannot say which rows an answer reads.
      - name: listed
        preserves: agentic.workspace.Workspace
        instance: workspace_id
        returns: true

  - name: agentic.files.toolset.Search
    naming:
      wire: search
      display: search
      summary: >-
        Finds text in the files of a workspace. Input: workspace, pattern, an optional directory to
        search under. Answer: the matches, with path, line and excerpt. Effect: none.
    input:
      - {name: workspace_id, type: agentic.shared.WorkspaceId}
      - {name: pattern, type: String}
      - {name: under, type: Optional<agentic.workspace.Path>}
    response:
      - {name: matches, type: List<agentic.files.toolset.SearchMatch>}
    outcomes:
      - name: unknown-workspace
        unknown_instance: true
        error: agentic.files.toolset.UnknownWorkspace
        payload:
          agentic.files.toolset.UnknownWorkspace: {workspace_id: input.workspace_id}
      # UNMAPPED: the pattern's language (literal text or a regular expression, and which one) is
      # not settled. Open question for the owner.
      - name: searched
        preserves: agentic.workspace.Workspace
        instance: workspace_id
        returns: true

  - name: agentic.files.toolset.MoveFile
    naming:
      wire: move
      display: move
      summary: "Gives one file another path. Input: the file, its workspace, a lease, the new path. Effect: the File's path."
    input:
      - {name: file_id, type: agentic.files.toolset.FileId}
      - {name: workspace_id, type: agentic.shared.WorkspaceId}
      - {name: lease_id, type: agentic.shared.LeaseId}
      - {name: to, type: agentic.workspace.Path}
      - {name: at, type: Timestamp}
    outcomes:
      - name: no-such-file
        unknown_instance: true
        error: agentic.files.toolset.FileNotFound
        payload:
          agentic.files.toolset.FileNotFound: {file_id: input.file_id}
      - name: other-workspace
        when_subject:
          predicate: workspace_id != input.workspace_id
        error: agentic.files.toolset.OtherWorkspace
        payload:
          agentic.files.toolset.OtherWorkspace:
            file_id: input.file_id
            workspace_id: {subject: workspace_id}
      - name: unknown-lease
        when_related: {via: input.lease_id, exists: false}
        error: agentic.files.toolset.UnknownLease
        payload:
          agentic.files.toolset.UnknownLease: {lease_id: input.lease_id}
      - name: lease-not-live
        when_related: {via: input.lease_id, predicate: state != Live}
        error: agentic.files.toolset.LeaseNotLive
        payload:
          agentic.files.toolset.LeaseNotLive: {lease_id: input.lease_id}
      - name: lease-of-other-workspace
        when_related: {via: input.lease_id, predicate: workspace_id != input.workspace_id}
        error: agentic.files.toolset.LeaseOfOtherWorkspace
        payload:
          agentic.files.toolset.LeaseOfOtherWorkspace: {lease_id: input.lease_id}
      # UNMAPPED: a move onto a path another file of the workspace holds is not refused here: ESS
      # 0.99.2 refuses a row-set guard beside the `when_subject` guard above (ESS-COMMAND-009). copy
      # refuses it (PathTaken). Open question for the owner.
      - name: moved
        updates: agentic.files.toolset.File
        instance: file_id
        sets:
          path: input.to
          last_lease_id: input.lease_id
        emits: [agentic.files.toolset.FileMoved]
        payload:
          agentic.files.toolset.FileMoved:
            file_id: input.file_id
            lease_id: input.lease_id
            from: {subject: path}
            to: input.to
            at: input.at

  - name: agentic.files.toolset.CopyFile
    naming:
      wire: copy
      display: copy
      summary: >-
        Copies one file to a new path in the same workspace. Input: the source, the new file, the
        workspace, a lease, the new path. Effect: a new File with the source's content.
    input:
      - {name: file_id, type: agentic.files.toolset.FileId}
      - {name: source_file_id, type: agentic.files.toolset.FileId}
      - {name: workspace_id, type: agentic.shared.WorkspaceId}
      - {name: lease_id, type: agentic.shared.LeaseId}
      - {name: to, type: agentic.workspace.Path}
      - {name: at, type: Timestamp}
    outcomes:
      - name: exists
        existing_instance: true
        error: agentic.files.toolset.FileExists
        payload:
          agentic.files.toolset.FileExists: {file_id: input.file_id}
      - name: no-such-source
        when_related: {via: input.source_file_id, exists: false}
        error: agentic.files.toolset.FileNotFound
        payload:
          agentic.files.toolset.FileNotFound: {file_id: input.source_file_id}
      - name: unknown-lease
        when_related: {via: input.lease_id, exists: false}
        error: agentic.files.toolset.UnknownLease
        payload:
          agentic.files.toolset.UnknownLease: {lease_id: input.lease_id}
      - name: source-in-other-workspace
        when_related: {via: input.source_file_id, predicate: workspace_id != input.workspace_id}
        error: agentic.files.toolset.OtherWorkspace
        payload:
          agentic.files.toolset.OtherWorkspace:
            file_id: input.source_file_id
            workspace_id: {related: {via: input.source_file_id, field: workspace_id}}
      - name: lease-not-live
        when_related: {via: input.lease_id, predicate: state != Live}
        error: agentic.files.toolset.LeaseNotLive
        payload:
          agentic.files.toolset.LeaseNotLive: {lease_id: input.lease_id}
      - name: lease-of-other-workspace
        when_related: {via: input.lease_id, predicate: workspace_id != input.workspace_id}
        error: agentic.files.toolset.LeaseOfOtherWorkspace
        payload:
          agentic.files.toolset.LeaseOfOtherWorkspace: {lease_id: input.lease_id}
      - name: path-taken
        when_related:
          entity: agentic.files.toolset.File
          where:
            all:
              - workspace_id == input.workspace_id
              - path == input.to
          exists: true
        error: agentic.files.toolset.PathTaken
        payload:
          agentic.files.toolset.PathTaken: {path: input.to}
      - name: copied
        creates: agentic.files.toolset.File
        instance: file_id
        sets:
          workspace_id: input.workspace_id
          path: input.to
          content: {related: {via: input.source_file_id, field: content}}
          executable: {related: {via: input.source_file_id, field: executable}}
          last_lease_id: input.lease_id
        emits: [agentic.files.toolset.FileCopied]
        payload:
          agentic.files.toolset.FileCopied:
            file_id: input.file_id
            source_file_id: input.source_file_id
            lease_id: input.lease_id
            to: input.to
            at: input.at

  - name: agentic.files.toolset.DeleteFile
    naming:
      wire: delete
      display: delete
      summary: "Removes one file. Input: the file, its workspace, a lease. Effect: the File is gone."
    input:
      - {name: file_id, type: agentic.files.toolset.FileId}
      - {name: workspace_id, type: agentic.shared.WorkspaceId}
      - {name: lease_id, type: agentic.shared.LeaseId}
      - {name: at, type: Timestamp}
    outcomes:
      - name: no-such-file
        unknown_instance: true
        error: agentic.files.toolset.FileNotFound
        payload:
          agentic.files.toolset.FileNotFound: {file_id: input.file_id}
      - name: other-workspace
        when_subject:
          predicate: workspace_id != input.workspace_id
        error: agentic.files.toolset.OtherWorkspace
        payload:
          agentic.files.toolset.OtherWorkspace:
            file_id: input.file_id
            workspace_id: {subject: workspace_id}
      - name: unknown-lease
        when_related: {via: input.lease_id, exists: false}
        error: agentic.files.toolset.UnknownLease
        payload:
          agentic.files.toolset.UnknownLease: {lease_id: input.lease_id}
      - name: lease-not-live
        when_related: {via: input.lease_id, predicate: state != Live}
        error: agentic.files.toolset.LeaseNotLive
        payload:
          agentic.files.toolset.LeaseNotLive: {lease_id: input.lease_id}
      - name: lease-of-other-workspace
        when_related: {via: input.lease_id, predicate: workspace_id != input.workspace_id}
        error: agentic.files.toolset.LeaseOfOtherWorkspace
        payload:
          agentic.files.toolset.LeaseOfOtherWorkspace: {lease_id: input.lease_id}
      - name: deleted
        deletes: agentic.files.toolset.File
        instance: file_id
        emits: [agentic.files.toolset.FileDeleted]
        payload:
          agentic.files.toolset.FileDeleted:
            file_id: input.file_id
            lease_id: input.lease_id
            at: input.at

events:
  - name: agentic.files.toolset.FileWritten
    fields:
      - {name: file_id, type: agentic.files.toolset.FileId}
      - {name: workspace_id, type: agentic.shared.WorkspaceId}
      - {name: lease_id, type: agentic.shared.LeaseId}
      - {name: path, type: agentic.workspace.Path}
      - {name: content, type: agentic.shared.Content}
      - {name: at, type: Timestamp}

  - name: agentic.files.toolset.FileEdited
    fields:
      - {name: file_id, type: agentic.files.toolset.FileId}
      - {name: lease_id, type: agentic.shared.LeaseId}
      - {name: before, type: agentic.shared.Content}
      - {name: at, type: Timestamp}

  - name: agentic.files.toolset.FileMoved
    fields:
      - {name: file_id, type: agentic.files.toolset.FileId}
      - {name: lease_id, type: agentic.shared.LeaseId}
      - {name: from, type: agentic.workspace.Path}
      - {name: to, type: agentic.workspace.Path}
      - {name: at, type: Timestamp}

  - name: agentic.files.toolset.FileCopied
    fields:
      - {name: file_id, type: agentic.files.toolset.FileId}
      - {name: source_file_id, type: agentic.files.toolset.FileId}
      - {name: lease_id, type: agentic.shared.LeaseId}
      - {name: to, type: agentic.workspace.Path}
      - {name: at, type: Timestamp}

  - name: agentic.files.toolset.FileDeleted
    fields:
      - {name: file_id, type: agentic.files.toolset.FileId}
      - {name: lease_id, type: agentic.shared.LeaseId}
      - {name: at, type: Timestamp}

views:
  - name: agentic.files.toolset.Files
    source: agentic.files.toolset.File
    consistency: read_your_writes
    fields:
      - {name: file_id, type: agentic.files.toolset.FileId}
      - {name: workspace_id, type: agentic.shared.WorkspaceId}
      - {name: path, type: agentic.workspace.Path}
      - {name: content, type: agentic.shared.Content}
      - {name: executable, type: Boolean}
      - {name: last_lease_id, type: agentic.shared.LeaseId}
