# A work queue's claim, walked by hand: synthesis reaches a claimed item but no second principal to
# release or finish it, so the claimer guard (not-the-claimer) is unreached. One principal claims an
# item; a second may neither claim, release nor finish it; the claimer releases it, the second
# principal claims it and finishes it; the finished item takes no claim, release or withdrawal.
# Synthesis also reaches none of the refusals of Enqueue (ESS-SYNTH-001, -003): an item naming no
# item or two, a queue, issue or task that does not exist, and a closed queue are refused.
type: ess-scenario/7
domain: agentic.tracking.queue
scenario: queue-item-held-by-its-claimer
summary: A claimed item is released or finished only by its claimer; a released item can be claimed by another.

